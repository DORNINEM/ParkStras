<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Français — Tesseract.js · Images & PDF</title>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
      --border: #30363d; --accent: #1f6feb; --accent-h: #388bfd;
      --text: #c9d1d9; --text-b: #f0f6fc; --muted: #8b949e;
      --green: #3fb950; --yellow: #d29922; --red: #f85149; --r: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px 16px; font-size: 14px; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 22px; }
    h1 { font-size: 24px; color: var(--text-b); margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 12px; }

    /* Options bar */
    .options-bar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
      padding: 12px 14px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 14px;
    }
    .opt-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
    .opt-group label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
    .opt-group select {
      padding: 6px 10px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 13px; cursor: pointer; outline: none;
    }
    .opt-group select:focus { border-color: var(--accent); }
    .opt-sep { width: 1px; background: var(--border); align-self: stretch; margin: 2px 0; }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed var(--border); border-radius: var(--r); padding: 28px 20px;
      text-align: center; cursor: pointer; transition: all .2s; background: var(--surface); margin-bottom: 14px;
    }
    .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: rgba(31,111,235,.05); }
    .drop-icon { font-size: 36px; margin-bottom: 8px; }
    .drop-zone p { color: var(--muted); margin-bottom: 12px; font-size: 13px; }
    .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .run-btn { text-align: center; margin-bottom: 18px; }
    .run-btn .btn { padding: 10px 36px; font-size: 15px; }

    /* Buttons */
    .btn { padding: 7px 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; white-space: nowrap; }
    .btn:hover { border-color: var(--accent-h); color: var(--accent-h); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); border-color: var(--accent-h); color: #fff; }

    /* Workspace */
    .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
    @media (max-width: 700px) { .workspace { grid-template-columns: 1fr; } }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .panel-head {
      padding: 9px 13px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      font-weight: 600; font-size: 13px; color: var(--text-b); background: var(--surface2);
      gap: 8px;
    }
    .panel-head .right { display: flex; gap: 6px; align-items: center; }
    .chip { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: rgba(31,111,235,.15); color: var(--accent-h); border: 1px solid rgba(31,111,235,.3); white-space: nowrap; }
    .page-nav { display: flex; align-items: center; gap: 6px; }
    .page-nav button { padding: 1px 8px; font-size: 15px; line-height: 1.4; }
    .page-nav span { font-size: 12px; color: var(--muted); min-width: 50px; text-align: center; }

    /* Canvas */
    .canvas-wrap { min-height: 180px; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
    #previewCanvas { max-width: 100%; max-height: 420px; display: none; }
    .canvas-ph { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 13px; }
    .box-count { padding: 5px 12px; font-size: 12px; color: var(--muted); background: var(--surface2); display: none; }

    /* Result */
    .panel-body { padding: 12px; }
    #resultText { width: 100%; height: 340px; background: #0a0e14; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; color: var(--text); font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.65; resize: vertical; outline: none; }
    #resultText:focus { border-color: var(--accent); }

    /* Status */
    .status-bar { display: flex; align-items: center; gap: 10px; padding: 8px 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.ok { background: var(--green); }
    .dot.loading { background: var(--yellow); animation: blink 1s infinite; }
    .dot.err { background: var(--red); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
    .progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 5px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 200; align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; width: min(600px, 96vw); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-head h3 { color: var(--text-b); font-size: 15px; }
    #camVideo { width: 100%; border-radius: 6px; margin-bottom: 12px; background: #000; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>🔍 OCR Français</h1>
    <p class="subtitle">Tesseract.js v5 · Images (JPG, PNG, TIFF…) & PDF · 100% navigateur, sans serveur</p>
  </header>

  <!-- Options -->
  <div class="options-bar">
    <div class="opt-group">
      <label>Langue</label>
      <select id="langSel">
        <option value="fra" selected>Français</option>
        <option value="fra+eng">Français + Anglais</option>
        <option value="eng">Anglais</option>
        <option value="deu">Allemand</option>
        <option value="spa">Espagnol</option>
        <option value="ita">Italien</option>
        <option value="por">Portugais</option>
        <option value="lat">Latin</option>
      </select>
    </div>
    <div class="opt-sep"></div>
    <div class="opt-group">
      <label>Segmentation (PSM)</label>
      <select id="psmSel">
        <option value="3" selected>Auto — document complet</option>
        <option value="1">Auto + détection orientation</option>
        <option value="4">Colonne de texte unique</option>
        <option value="6">Bloc de texte uniforme</option>
        <option value="7">Ligne de texte unique</option>
        <option value="8">Mot unique</option>
        <option value="11">Texte épars / formulaire</option>
        <option value="12">Texte épars + orientation</option>
      </select>
    </div>
    <div class="opt-sep"></div>
    <div class="opt-group">
      <label>Moteur (OEM)</label>
      <select id="oemSel">
        <option value="3" selected>Auto — LSTM + Legacy (recommandé)</option>
        <option value="1">LSTM seul — neural</option>
        <option value="0">Legacy seul — rapide</option>
      </select>
    </div>
    <div class="opt-sep"></div>
    <!-- PDF-only options (hidden by default) -->
    <div class="opt-group" id="pdfResGroup" style="display:none">
      <label>Résolution PDF</label>
      <select id="pdfScale">
        <option value="2">144 DPI — rapide</option>
        <option value="3" selected>216 DPI — recommandé</option>
        <option value="4">288 DPI — précis</option>
        <option value="5">360 DPI — lent</option>
      </select>
    </div>
    <div class="opt-group" id="pdfPagesGroup" style="display:none">
      <label>Pages à traiter</label>
      <select id="pdfPagesSel">
        <option value="all">Toutes les pages</option>
        <option value="current">Page affichée seulement</option>
        <option value="range">Plage…</option>
      </select>
    </div>
    <div class="opt-group" id="pdfRangeGroup" style="display:none">
      <label>Plage (ex: 1-3, 5)</label>
      <input type="text" id="pdfRange" placeholder="1-3, 5, 7-9"
        style="padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none">
    </div>
  </div>

  <!-- Drop zone -->
  <div class="drop-zone" id="dropZone">
    <div class="drop-icon">📄</div>
    <p>Glissez une image ou un PDF ici</p>
    <div class="btn-row" onclick="event.stopPropagation()">
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">📁 Fichier</button>
      <button class="btn" onclick="openCamera()">📷 Caméra</button>
      <button class="btn" onclick="loadSample()">🖼️ Exemple</button>
    </div>
    <input type="file" id="fileInput" accept="image/*,.pdf,application/pdf" hidden>
  </div>

  <!-- Run -->
  <div class="run-btn">
    <button class="btn btn-primary" id="ocrBtn" onclick="runOCR()" disabled>▶ Lancer l'OCR</button>
  </div>

  <!-- Workspace -->
  <div class="workspace">
    <!-- Preview -->
    <div class="panel">
      <div class="panel-head">
        <span>📄 Aperçu</span>
        <div class="right">
          <div class="page-nav" id="pageNav" style="display:none">
            <button class="btn" onclick="gotoPage(currentPage - 1)">‹</button>
            <span id="pageInfo">1 / 1</span>
            <button class="btn" onclick="gotoPage(currentPage + 1)">›</button>
          </div>
          <span class="chip" id="imgChip" style="display:none"></span>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="previewCanvas"></canvas>
        <div class="canvas-ph" id="canvasPh">Aucun fichier chargé<br><small style="color:var(--muted);margin-top:6px;display:block">Images : JPG, PNG, GIF, TIFF, WebP<br>Documents : PDF</small></div>
      </div>
      <div class="box-count" id="boxCount"></div>
    </div>

    <!-- Results -->
    <div class="panel">
      <div class="panel-head">
        <span>📝 Texte reconnu</span>
        <div class="right">
          <button class="btn" id="copyBtn" onclick="copyText()" style="padding:3px 10px;font-size:12px" disabled>📋 Copier</button>
          <button class="btn" id="dlBtn" onclick="downloadText()" style="padding:3px 10px;font-size:12px" disabled>💾 .txt</button>
        </div>
      </div>
      <div class="panel-body">
        <textarea id="resultText" placeholder="Le texte reconnu apparaîtra ici…" readonly></textarea>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="statusTxt">Prêt — sélectionnez une image ou un PDF</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
</div>

<!-- Camera modal -->
<div class="modal" id="camModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>📷 Capture caméra</h3>
      <button class="btn" onclick="closeCamera()">✕</button>
    </div>
    <video id="camVideo" autoplay playsinline muted></video>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="captureFrame()">📸 Capturer</button>
      <button class="btn" onclick="closeCamera()">Annuler</button>
    </div>
  </div>
</div>

<!-- Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
// ─── Tesseract v5 CDN — seul langPath est forcé ; worker/core utilisent les
//     défauts jsdelivr baked-in dans le bundle. ──────────────────────────────
const TESS_CDN = {
  langPath: 'https://tessdata.projectnaptha.com/4.0.0',
};

// ─── State ────────────────────────────────────────────────────────────────────
let srcImage  = null;   // HTMLImageElement (image mode)
let pdfDoc    = null;   // PDF.js PDFDocumentProxy
let currentPage = 1;
let camStream = null;
let scaleFactor = 1;

// ─── PDF.js worker ────────────────────────────────────────────────────────────
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// ─── Options — plage de pages ─────────────────────────────────────────────────
document.getElementById('pdfPagesSel').addEventListener('change', e => {
  document.getElementById('pdfRangeGroup').style.display =
    e.target.value === 'range' ? '' : 'none';
});

// ─── File input ───────────────────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
dz.addEventListener('click', () => document.getElementById('fileInput').click());

async function handleFile(file) {
  resetState();
  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  if (isPdf) await loadPdf(file);
  else        await loadImage(file);
}

function resetState() {
  srcImage = null; pdfDoc = null; currentPage = 1;
  document.getElementById('resultText').value = '';
  document.getElementById('copyBtn').disabled = true;
  document.getElementById('dlBtn').disabled = true;
  document.getElementById('ocrBtn').disabled = true;
  document.getElementById('boxCount').style.display = 'none';
  document.getElementById('pageNav').style.display = 'none';
  document.getElementById('pdfResGroup').style.display = 'none';
  document.getElementById('pdfPagesGroup').style.display = 'none';
  document.getElementById('pdfRangeGroup').style.display = 'none';
  document.getElementById('imgChip').style.display = 'none';
  setProgress(0);
}

// ─── Image ────────────────────────────────────────────────────────────────────
function loadImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        srcImage = img;
        drawImagePreview(img);
        document.getElementById('ocrBtn').disabled = false;
        showChip(`${img.width} × ${img.height}`);
        setStatus('ok', `Image chargée : ${file.name} (${img.width}×${img.height})`);
        resolve();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ─── PDF ──────────────────────────────────────────────────────────────────────
async function loadPdf(file) {
  if (typeof pdfjsLib === 'undefined') {
    setStatus('err', 'PDF.js non chargé — vérifiez votre connexion.');
    return;
  }
  setStatus('loading', 'Lecture du PDF…'); setProgress(10);
  try {
    const buf = await file.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
    const n = pdfDoc.numPages;
    showChip(`PDF · ${n} page${n > 1 ? 's' : ''}`);
    document.getElementById('pdfResGroup').style.display = '';
    document.getElementById('pdfPagesGroup').style.display = '';
    if (n > 1) document.getElementById('pageNav').style.display = 'flex';
    document.getElementById('ocrBtn').disabled = false;
    setProgress(0);
    setStatus('ok', `PDF chargé : ${n} page(s) — ${file.name}`);
    await gotoPage(1);
  } catch (err) {
    setStatus('err', `Erreur PDF : ${err.message}`);
    setProgress(0);
  }
}

async function renderPdfPageToCanvas(pageNum) {
  const scale = parseFloat(document.getElementById('pdfScale').value) || 3;
  const page  = await pdfDoc.getPage(pageNum);
  const vp    = page.getViewport({ scale });
  const c     = document.createElement('canvas');
  c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  return c;
}

async function gotoPage(n) {
  if (!pdfDoc) return;
  n = Math.max(1, Math.min(n, pdfDoc.numPages));
  currentPage = n;
  document.getElementById('pageInfo').textContent = `${n} / ${pdfDoc.numPages}`;
  setStatus('loading', `Rendu page ${n}…`);
  const c = await renderPdfPageToCanvas(n);
  displayCanvasOnPreview(c);
  setStatus('ok', `Page ${n} / ${pdfDoc.numPages}`);
}

// ─── Canvas preview ───────────────────────────────────────────────────────────
function displayCanvasOnPreview(srcCanvas) {
  const cv = document.getElementById('previewCanvas');
  document.getElementById('canvasPh').style.display = 'none';
  cv.style.display = 'block';
  const maxW = cv.parentElement.clientWidth || 480, maxH = 420;
  scaleFactor = Math.min(maxW / srcCanvas.width, maxH / srcCanvas.height, 1);
  cv.width  = Math.round(srcCanvas.width  * scaleFactor);
  cv.height = Math.round(srcCanvas.height * scaleFactor);
  cv.getContext('2d').drawImage(srcCanvas, 0, 0, cv.width, cv.height);
}

function drawImagePreview(img, boxes) {
  const cv = document.getElementById('previewCanvas');
  document.getElementById('canvasPh').style.display = 'none';
  cv.style.display = 'block';
  const maxW = cv.parentElement.clientWidth || 480, maxH = 420;
  scaleFactor = Math.min(maxW / img.width, maxH / img.height, 1);
  cv.width  = Math.round(img.width  * scaleFactor);
  cv.height = Math.round(img.height * scaleFactor);
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  if (boxes && boxes.length) {
    ctx.strokeStyle = '#1f6feb'; ctx.lineWidth = 1.5;
    ctx.fillStyle = 'rgba(31,111,235,0.07)';
    boxes.forEach(b => {
      ctx.beginPath();
      ctx.rect(b.x * scaleFactor, b.y * scaleFactor, b.w * scaleFactor, b.h * scaleFactor);
      ctx.fill(); ctx.stroke();
    });
    document.getElementById('boxCount').style.display = 'block';
    document.getElementById('boxCount').textContent = `${boxes.length} ligne(s) détectée(s)`;
  }
}

// ─── Parse page range string "1-3, 5, 7-9" ───────────────────────────────────
function parsePageRange(str, total) {
  const pages = new Set();
  str.split(/[,;]/).forEach(part => {
    part = part.trim();
    const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
    if (m) {
      for (let i = parseInt(m[1]); i <= parseInt(m[2]); i++)
        if (i >= 1 && i <= total) pages.add(i);
    } else {
      const n = parseInt(part);
      if (!isNaN(n) && n >= 1 && n <= total) pages.add(n);
    }
  });
  return [...pages].sort((a, b) => a - b);
}

// ─── OCR main ─────────────────────────────────────────────────────────────────
async function runOCR() {
  const btn = document.getElementById('ocrBtn');
  btn.disabled = true;
  document.getElementById('resultText').value = '';
  document.getElementById('copyBtn').disabled = true;
  document.getElementById('dlBtn').disabled = true;
  document.getElementById('boxCount').style.display = 'none';
  setProgress(0);

  const lang = document.getElementById('langSel').value;
  const psm  = document.getElementById('psmSel').value;
  const oem  = parseInt(document.getElementById('oemSel').value);

  try {
    setStatus('loading', `Initialisation Tesseract (${lang})…`);
    setProgress(5);

    // Create worker once — reused for all PDF pages
    // Les chemins CDN absolus sont INDISPENSABLES (sinon hang infini sur GitHub Pages)
    const worker = await Tesseract.createWorker(lang, oem, {
      ...TESS_CDN,
      logger: m => {
        if (m.status === 'loading tesseract core')       { setProgress(7);  setStatus('loading', 'Chargement moteur Tesseract…'); }
        if (m.status === 'initializing tesseract')       { setProgress(14); setStatus('loading', 'Initialisation…'); }
        if (m.status === 'loading language traineddata') {
          const pct = Math.round((m.progress || 0) * 100);
          setProgress(14 + (m.progress || 0) * 18);
          setStatus('loading', `Téléchargement modèle ${lang}… ${pct}%`);
        }
        if (m.status === 'initialized api')              { setProgress(34); setStatus('loading', 'Prêt — lancement reconnaissance…'); }
      }
    });

    await worker.setParameters({ tessedit_pageseg_mode: psm });
    setProgress(36);

    let allText = '';

    if (pdfDoc) {
      // ── PDF mode ────────────────────────────────────────────────────────────
      const total = pdfDoc.numPages;
      const pagesSel = document.getElementById('pdfPagesSel').value;
      let pagesToProcess;
      if (pagesSel === 'current') {
        pagesToProcess = [currentPage];
      } else if (pagesSel === 'range') {
        pagesToProcess = parsePageRange(document.getElementById('pdfRange').value, total);
        if (!pagesToProcess.length) pagesToProcess = [currentPage];
      } else {
        pagesToProcess = Array.from({ length: total }, (_, i) => i + 1);
      }

      const multi = pagesToProcess.length > 1;
      for (let i = 0; i < pagesToProcess.length; i++) {
        const pNum = pagesToProcess[i];
        const progressBase = 36 + (i / pagesToProcess.length) * 60;

        setStatus('loading', `Rendu PDF page ${pNum}/${total}…`);
        setProgress(progressBase);
        const pageCanvas = await renderPdfPageToCanvas(pNum);
        displayCanvasOnPreview(pageCanvas);
        document.getElementById('pageInfo').textContent = `${pNum} / ${total}`;

        setStatus('loading', `OCR page ${pNum} (${i+1}/${pagesToProcess.length})…`);
        const { data } = await worker.recognize(pageCanvas);
        setProgress(progressBase + (1 / pagesToProcess.length) * 58);

        if (multi) allText += `\n${'─'.repeat(14)} Page ${pNum} ${'─'.repeat(14)}\n${data.text.trim()}\n`;
        else allText = data.text;
      }
    } else if (srcImage) {
      // ── Single image mode ───────────────────────────────────────────────────
      setStatus('loading', 'Reconnaissance en cours…'); setProgress(40);
      const { data } = await worker.recognize(srcImage);
      allText = data.text;
      const boxes = data.lines
        .filter(l => l.bbox)
        .map(l => ({ x: l.bbox.x0, y: l.bbox.y0, w: l.bbox.x1 - l.bbox.x0, h: l.bbox.y1 - l.bbox.y0 }));
      setProgress(94);
      drawImagePreview(srcImage, boxes);
    }

    await worker.terminate();

    const trimmed = allText.trim();
    document.getElementById('resultText').value = trimmed || '(aucun texte détecté)';
    document.getElementById('copyBtn').disabled = !trimmed;
    document.getElementById('dlBtn').disabled   = !trimmed;
    const lines = trimmed.split('\n').filter(l => l.trim()).length;
    setStatus('ok', `Terminé — ${lines} ligne(s) reconnue(s)`);
    setProgress(100);

  } catch (err) {
    const msg = (err && (err.message || String(err))) || 'Erreur inconnue';
    setStatus('err', msg.split('\n')[0]);
    document.getElementById('resultText').value = '⚠️ Erreur\n\n' + msg +
      '\n\nSi le chargement restait bloqué, le problème était les chemins CDN.\n' +
      'Vérifiez la console (F12) pour les détails.';
    setProgress(0);
  }
  btn.disabled = false;
}

// ─── Sample image ─────────────────────────────────────────────────────────────
function loadSample() {
  const c = document.createElement('canvas');
  c.width = 700; c.height = 380;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);

  const lines = [
    { t: 'bold 30px Arial',             y: 58,  s: '#111', x: 40, txt: 'Bonjour le Monde !' },
    { t: '22px Arial',                   y: 105, s: '#111', x: 40, txt: "Ceci est un test d'OCR en français." },
    { t: '20px Arial',                   y: 148, s: '#333', x: 40, txt: 'Caractères : é è ê ë à â ù û ü ç î ï ô œ æ' },
    { t: '18px Arial',                   y: 188, s: '#444', x: 40, txt: 'Le vif renard brun saute par-dessus le chien paresseux.' },
    { t: '17px Arial',                   y: 222, s: '#444', x: 40, txt: "L'intelligence artificielle transforme notre société." },
    { t: 'italic 20px "Times New Roman"',y: 280, s: '#1a3c78', x: 40, txt: 'Texte italique : été, façon, cœur, naïf' },
    { t: '14px "Courier New"',           y: 320, s: '#555', x: 40, txt: '123 avenue des Champs-Élysées — Paris 75008' },
    { t: '13px Arial',                   y: 358, s: '#777', x: 40, txt: 'Tél : +33 1 23 45 67 89 — contact@exemple.fr' },
  ];
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(40, 255); ctx.lineTo(c.width - 40, 255); ctx.stroke();
  lines.forEach(l => { ctx.font = l.t; ctx.fillStyle = l.s; ctx.fillText(l.txt, l.x, l.y); });

  const img = new Image();
  img.onload = () => {
    srcImage = img; drawImagePreview(img);
    document.getElementById('ocrBtn').disabled = false;
    showChip(`${img.width} × ${img.height}`);
    setStatus('ok', 'Image exemple générée');
  };
  img.src = c.toDataURL();
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function showChip(txt) {
  const c = document.getElementById('imgChip');
  c.style.display = ''; c.textContent = txt;
}
function setStatus(state, msg) {
  const d = document.getElementById('dot');
  d.className = 'dot';
  if (state === 'loading') d.classList.add('loading');
  else if (state === 'ok')  d.classList.add('ok');
  else if (state === 'err') d.classList.add('err');
  document.getElementById('statusTxt').textContent = msg;
}
function setProgress(p) {
  document.getElementById('prog').style.width = Math.min(100, Math.max(0, p)) + '%';
}
function copyText() {
  navigator.clipboard.writeText(document.getElementById('resultText').value).then(() => {
    const b = document.getElementById('copyBtn');
    b.textContent = '✓ Copié !';
    setTimeout(() => b.textContent = '📋 Copier', 2000);
  });
}
function downloadText() {
  const text = document.getElementById('resultText').value;
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' })),
    download: 'ocr-result.txt'
  });
  a.click(); URL.revokeObjectURL(a.href);
}

// ─── Camera ───────────────────────────────────────────────────────────────────
async function openCamera() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    document.getElementById('camVideo').srcObject = camStream;
    document.getElementById('camModal').classList.add('open');
  } catch (e) { setStatus('err', `Caméra : ${e.message}`); }
}
function closeCamera() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  document.getElementById('camModal').classList.remove('open');
}
function captureFrame() {
  const v = document.getElementById('camVideo');
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  const img = new Image();
  img.onload = () => {
    srcImage = img; drawImagePreview(img);
    document.getElementById('ocrBtn').disabled = false;
    showChip(`${img.width} × ${img.height}`);
    closeCamera();
    setStatus('ok', `Capture : ${img.width}×${img.height}`);
  };
  img.src = c.toDataURL('image/jpeg', 0.95);
}
</script>
