<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Galaxie 3D avec Nébuleuses et Contrôles</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    #toggleTheme {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      padding: 10px 15px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="toggleTheme">Changer le thème</button>
  <script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.158.0';
    import { OrbitControls } from 'https://cdn.skypack.dev/three@0.158.0/examples/jsm/controls/OrbitControls.js';

    let scene, camera, renderer, controls;
    let particles, material, galaxyColors;
    let points;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.z = 60;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);

      // Lumière
      const light = new THREE.PointLight(0xffffff, 1.5, 500);
      light.position.set(0, 0, 0);
      scene.add(light);

      // Texture de nébuleuse (cloud-like)
      const textureLoader = new THREE.TextureLoader();
      const nebulaTexture = textureLoader.load('https://i.imgur.com/8aU9OZ9.png', () => renderer.render(scene, camera));

      const spriteMaterial = new THREE.SpriteMaterial({ map: nebulaTexture, transparent: true, opacity: 0.3 });
      for (let i = 0; i < 8; i++) {
        const sprite = new THREE.Sprite(spriteMaterial.clone());
        sprite.scale.set(100, 100, 1);
        sprite.position.set(
          (Math.random() - 0.5) * 80,
          (Math.random() - 0.5) * 30,
          (Math.random() - 0.5) * 80
        );
        scene.add(sprite);
      }

      createGalaxy();
      window.addEventListener('resize', onWindowResize);
      document.getElementById('toggleTheme').addEventListener('click', switchTheme);
    }

    function createGalaxy() {
      const count = 20000;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      galaxyColors = [
        [1.0, 0.5, 0.2],
        [0.2, 0.6, 1.0],
        [0.9, 0.1, 0.9],
        [0.4, 1.0, 0.7]
      ];
      const themeIndex = Math.floor(Math.random() * galaxyColors.length);
      const [rBase, gBase, bBase] = galaxyColors[themeIndex];

      for (let i = 0; i < count; i++) {
        const radius = Math.random() * 50;
        const angle = radius * 0.3 + Math.random() * 2;
        const spiral = i % 2 === 0 ? 1 : -1;

        const x = Math.cos(angle) * radius * spiral;
        const y = (Math.random() - 0.5) * 10;
        const z = Math.sin(angle) * radius * spiral;

        positions.set([x, y, z], i * 3);

        const r = rBase * (0.8 + Math.random() * 0.2);
        const g = gBase * (0.8 + Math.random() * 0.2);
        const b = bBase * (0.8 + Math.random() * 0.2);
        colors.set([r, g, b], i * 3);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      material = new THREE.PointsMaterial({
        size: 0.5,
        vertexColors: true,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      if (points) scene.remove(points);
      points = new THREE.Points(geometry, material);
      scene.add(points);
    }

    function switchTheme() {
      createGalaxy();
    }

    function animate() {
      requestAnimationFrame(animate);
      points.rotation.y += 0.0005;
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
