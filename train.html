<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TrainTrack SNCF</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
–bg: #0d1117;
–surface: #161b22;
–card: #1c2333;
–border: #30363d;
–accent: #f97316;
–accent-dim: rgba(249,115,22,0.15);
–green: #3fb950;
–red: #f85149;
–yellow: #d29922;
–text: #e6edf3;
–muted: #7d8590;
–panel-bg: rgba(13,17,23,0.97);
–radius: 18px;
}

html, body { height: 100%; overflow: hidden; font-family: ‘Syne’, sans-serif; background: var(–bg); color: var(–text); }

/* MAP */
#map { position: fixed; inset: 0; z-index: 0; }
.leaflet-tile { filter: brightness(0.55) saturate(0.6); }
.leaflet-control-zoom a {
background: var(–surface) !important; color: var(–text) !important;
border-color: var(–border) !important;
}

/* TOPBAR */
.topbar {
position: fixed; top: 0; left: 0; right: 0; z-index: 100;
padding: 12px 14px 0;
pointer-events: none;
}
.search-pill {
display: flex; align-items: center; gap: 8px;
background: var(–surface);
border: 1px solid var(–border);
border-radius: 50px;
padding: 8px 8px 8px 16px;
box-shadow: 0 4px 24px rgba(0,0,0,0.7);
pointer-events: all;
}
.pill-icon { font-size: 20px; flex-shrink: 0; }
.train-input {
flex: 1; min-width: 0;
background: transparent; border: none; outline: none;
color: var(–text);
font-family: ‘Space Mono’, monospace;
font-size: 22px; font-weight: 700; letter-spacing: 3px;
}
.train-input::placeholder { color: var(–muted); font-size: 14px; letter-spacing: 1px; }
.btn-go {
background: var(–accent); color: white; border: none;
border-radius: 40px; padding: 10px 22px;
font-family: ‘Syne’, sans-serif; font-weight: 700; font-size: 14px;
cursor: pointer; flex-shrink: 0; transition: opacity .15s;
}
.btn-go:active { opacity: .75; }
.btn-go:disabled { opacity: .4; }

.chips-bar {
display: flex; gap: 6px; padding: 8px 0 0;
overflow-x: auto; pointer-events: all;
}
.chips-bar::-webkit-scrollbar { display: none; }
.chip {
font-family: ‘Space Mono’, monospace; font-size: 11px;
background: var(–surface); border: 1px solid var(–border);
border-radius: 20px; padding: 5px 12px;
white-space: nowrap; cursor: pointer; color: var(–muted); flex-shrink: 0;
}
.chip:active { border-color: var(–accent); color: var(–accent); }

/* MARKERS */
.train-pin {
width: 28px; height: 28px;
background: var(–accent); border: 3px solid white; border-radius: 50%;
box-shadow: 0 0 0 4px rgba(249,115,22,.3), 0 4px 12px rgba(0,0,0,.5);
animation: tpulse 2s ease-in-out infinite;
}
@keyframes tpulse {
0%,100% { box-shadow: 0 0 0 4px rgba(249,115,22,.3), 0 4px 12px rgba(0,0,0,.5); }
50%      { box-shadow: 0 0 0 10px rgba(249,115,22,.08), 0 4px 12px rgba(0,0,0,.5); }
}
.stop-dot-map {
width: 10px; height: 10px;
background: var(–surface); border: 2px solid var(–muted); border-radius: 50%;
}
.stop-dot-map.terminus { width: 14px; height: 14px; border-color: var(–accent); background: var(–accent-dim); }
.stop-dot-map.passed { opacity: .3; }

/* PANEL */
.panel {
position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
background: var(–panel-bg);
border-radius: var(–radius) var(–radius) 0 0;
border-top: 1px solid var(–border);
box-shadow: 0 -8px 40px rgba(0,0,0,.7);
display: flex; flex-direction: column;
max-height: 88vh;
transform: translateY(calc(100% - 88px));
transition: transform .35s cubic-bezier(.4,0,.2,1);
padding-bottom: env(safe-area-inset-bottom, 0);
touch-action: none; will-change: transform;
}
.panel.expanded { transform: translateY(0); }
.panel.peek     { transform: translateY(calc(100% - 88px)); }

.handle-zone {
padding: 10px 0 4px; display: flex; flex-direction: column;
align-items: center; cursor: grab; flex-shrink: 0; user-select: none;
}
.handle-bar { width: 40px; height: 4px; background: var(–border); border-radius: 2px; }

/* PEEK ROW */
.peek-row {
display: flex; align-items: center; gap: 12px;
padding: 4px 18px 14px; flex-shrink: 0; cursor: pointer;
}
.badge-num {
background: var(–accent); color: white;
font-family: ‘Space Mono’, monospace; font-size: 15px; font-weight: 700;
padding: 7px 13px; border-radius: 8px; letter-spacing: 2px; flex-shrink: 0;
}
.peek-info { flex: 1; min-width: 0; }
.peek-route { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.peek-status { font-size: 11px; color: var(–muted); margin-top: 2px; }
.delay-chip {
font-family: ‘Space Mono’, monospace; font-size: 12px; font-weight: 700;
padding: 5px 11px; border-radius: 20px; flex-shrink: 0;
}
.delay-chip.ok     { background: rgba(63,185,80,.15); color: var(–green); }
.delay-chip.warn   { background: rgba(210,153,34,.15); color: var(–yellow); }
.delay-chip.danger { background: rgba(248,81,73,.15); color: var(–red); }

/* SCROLL */
.panel-scroll {
flex: 1; overflow-y: auto; overscroll-behavior: contain;
-webkit-overflow-scrolling: touch;
}
.panel-scroll::-webkit-scrollbar { display: none; }

.section { padding: 0 18px 24px; }
.sec-label {
font-size: 10px; font-weight: 600; text-transform: uppercase;
letter-spacing: 1.5px; color: var(–muted);
padding: 16px 0 10px;
border-top: 1px solid var(–border);
}
.sec-label:first-child { border-top: none; padding-top: 4px; }

/* POSITION CARD */
.pos-card {
background: var(–card); border: 1px solid var(–border);
border-radius: 12px; padding: 14px 16px;
display: flex; align-items: flex-start; gap: 14px;
}
.pos-ico { font-size: 28px; flex-shrink: 0; padding-top: 2px; }
.pos-body { flex: 1; min-width: 0; }
.pos-title { font-size: 14px; font-weight: 700; }
.pos-sub { font-size: 11px; color: var(–muted); margin-top: 3px; }
.pos-prog { margin-top: 10px; height: 4px; background: var(–border); border-radius: 2px; overflow: hidden; }
.pos-prog-fill { height: 100%; background: var(–accent); border-radius: 2px; }

/* STOPS */
.stop-row {
display: grid; grid-template-columns: 18px 1fr auto;
gap: 10px; align-items: start;
}
.stop-tl { display: flex; flex-direction: column; align-items: center; padding-top: 3px; }
.stop-circle {
width: 10px; height: 10px; border-radius: 50%;
border: 2px solid var(–muted); background: var(–bg); flex-shrink: 0; z-index: 1;
}
.stop-circle.passed  { background: var(–muted); border-color: var(–muted); }
.stop-circle.current { width: 14px; height: 14px; margin-top: -2px; background: var(–accent); border-color: var(–accent); box-shadow: 0 0 8px var(–accent); }
.stop-circle.future  { background: var(–bg); border-color: var(–border); }
.stop-vline { width: 2px; flex: 1; min-height: 20px; background: var(–border); }
.stop-vline.passed { background: var(–muted); opacity: .35; }

.stop-name-t {
font-size: 14px; font-weight: 500; padding-top: 1px; padding-bottom: 22px;
line-height: 1.3;
}
.stop-name-t.passed  { color: var(–muted); }
.stop-name-t.current { color: var(–accent); font-weight: 700; }
.stop-times-t { text-align: right; padding-top: 1px; padding-bottom: 22px; }
.stop-time-v { font-family: ‘Space Mono’, monospace; font-size: 12px; color: var(–muted); }
.stop-delay-v { font-family: ‘Space Mono’, monospace; font-size: 11px; color: var(–red); margin-top: 2px; }

/* MSGS */
.panel-msg { padding: 32px 16px; text-align: center; color: var(–muted); font-size: 13px; line-height: 1.7; }
.panel-msg .ico { font-size: 40px; margin-bottom: 12px; }
.spinner {
width: 32px; height: 32px; border: 3px solid var(–border);
border-top-color: var(–accent); border-radius: 50%;
animation: spin .7s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* FOOTER */
.panel-footer {
display: flex; align-items: center; justify-content: space-between;
padding: 10px 18px; border-top: 1px solid var(–border); flex-shrink: 0;
}
.footer-info { font-family: ‘Space Mono’, monospace; font-size: 10px; color: var(–muted); }
.btn-refresh {
font-family: ‘Space Mono’, monospace; font-size: 11px;
background: var(–card); border: 1px solid var(–border);
color: var(–text); border-radius: 6px; padding: 5px 12px; cursor: pointer;
}
.btn-refresh:active { opacity: .6; }

/* POPUP */
.leaflet-popup-content-wrapper {
background: var(–card) !important; color: var(–text) !important;
border: 1px solid var(–border) !important; border-radius: 10px !important;
box-shadow: 0 4px 20px rgba(0,0,0,.6) !important; font-family: ‘Syne’, sans-serif;
}
.leaflet-popup-tip { background: var(–card) !important; }
.pu-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.pu-t { font-family: ‘Space Mono’, monospace; font-size: 11px; color: var(–muted); }
.pu-d { font-family: ‘Space Mono’, monospace; font-size: 11px; color: var(–red); margin-top: 2px; }
</style>

</head>
<body>

<div id="map"></div>

<div class="topbar">
  <div class="search-pill">
    <span class="pill-icon">🚄</span>
    <input id="trainInput" class="train-input" type="text" inputmode="numeric"
           placeholder="N° train (ex : 6201)" maxlength="8">
    <button class="btn-go" id="searchBtn" onclick="startTracking()">Suivre</button>
  </div>
  <div class="chips-bar">
    <span class="chip" onclick="setEx('6201')">TGV 6201</span>
    <span class="chip" onclick="setEx('8722')">TER 8722</span>
    <span class="chip" onclick="setEx('3657')">IC 3657</span>
    <span class="chip" onclick="setEx('6032')">TGV 6032</span>
    <span class="chip" onclick="setEx('6619')">TGV 6619</span>
  </div>
</div>

<div class="panel peek" id="panel">
  <div class="handle-zone" id="handleZone">
    <div class="handle-bar"></div>
  </div>

  <div class="peek-row" id="peekRow" onclick="togglePanel()">
    <div class="badge-num" id="badgeNum">—</div>
    <div class="peek-info">
      <div class="peek-route" id="peekRoute">Entrez un numéro de train</div>
      <div class="peek-status" id="peekStatus">Données SNCF temps réel</div>
    </div>
    <div class="delay-chip ok" id="delayChip" style="display:none"></div>
  </div>

  <div class="panel-scroll" id="panelScroll">
    <div class="section">
      <div class="panel-msg">
        <div class="ico">🔍</div>
        <strong>Suivi temps réel SNCF</strong><br>
        TGV · Intercités · TER<br><br>
        Entrez le numéro commercial du train<br>et appuyez sur <strong>Suivre</strong>.<br><br>
        <span style="font-size:11px">Source : transport.data.gouv.fr<br>GTFS-RT · mise à jour 2 min</span>
      </div>
    </div>
  </div>

  <div class="panel-footer" id="panelFooter" style="display:none">
    <div class="footer-info" id="footerInfo">—</div>
    <button class="btn-refresh" onclick="refreshData()">⟳ Actu</button>
  </div>
</div>

<script>
const GTFS_RT_URL = 'https://proxy.transport.data.gouv.fr/resource/sncf-gtfs-rt-trip-updates';
const CORS_PROXY  = 'https://corsproxy.io/?';

const GARES = {
  '87113001': [48.8448, 2.3735, 'Paris Gare de Lyon'],
  '87271007': [48.8769, 2.3553, 'Paris Nord'],
  '87281006': [48.8409, 2.3721, 'Paris Austerlitz'],
  '87547000': [48.8771, 2.3047, 'Paris Saint-Lazare'],
  '87384008': [48.8409, 2.3218, 'Paris Montparnasse'],
  '87722025': [43.7005, 7.2617, 'Nice-Ville'],
  '87751008': [43.2964, 5.3806, 'Marseille St-Charles'],
  '87313098': [45.7488, 4.8261, 'Lyon Part-Dieu'],
  '87313003': [45.7580, 4.8340, 'Lyon Perrache'],
  '87481002': [43.6115, 1.4542, 'Toulouse Matabiau'],
  '87212027': [48.5839, 7.7352, 'Strasbourg'],
  '87581009': [48.5839, 7.7352, 'Strasbourg'],
  '87215004': [48.5839, 7.7352, 'Strasbourg'],
  '87182063': [48.0748, 7.3580, 'Colmar'],
  '87583005': [48.0748, 7.3580, 'Colmar'],
  '87142000': [44.8379,-0.5784, 'Bordeaux St-Jean'],
  '87613455': [47.2105,-1.5418, 'Nantes'],
  '87613000': [47.2105,-1.5418, 'Nantes'],
  '87592006': [47.5219,-0.5525, 'Angers'],
  '87444677': [47.9010, 1.9080, 'Orléans'],
  '87273001': [50.6365, 3.0695, 'Lille Flandres'],
  '87286005': [50.6391, 3.0728, 'Lille Europe'],
  '87521005': [43.8359, 4.3597, 'Nîmes'],
  '87688002': [43.6052, 3.8800, 'Montpellier St-Roch'],
  '87765008': [47.3215, 5.0214, 'Dijon'],
  '87223263': [48.7249, 2.2731, 'Massy TGV'],
  '87386318': [48.7249, 2.2731, 'Massy TGV'],
  '87648012': [49.1020,-0.3622, 'Caen'],
  '87415398': [47.9975,-3.9989, 'Quimper'],
  '87471003': [48.1038,-1.6728, 'Rennes'],
  '87341024': [49.2444, 4.0284, 'Reims'],
  '87162008': [45.1805, 5.7213, 'Grenoble'],
  '87612119': [47.3915, 0.6856, 'Tours'],
  '87571000': [45.9217, 6.1860, 'Annecy'],
  '87741001': [45.5692, 5.9243, 'Chambéry'],
  '87251009': [50.2957, 2.7772, 'Arras'],
  '87394007': [49.8941, 2.2957, 'Amiens'],
  '87229013': [49.4447, 1.0909, 'Rouen Rive-Droite'],
  '87745000': [46.2041, 6.1426, 'Genève'],
  '87321123': [48.7330, 2.3646, 'Massy-Palaiseau'],
  '87758490': [48.8726, 2.7784, 'Marne-la-Vallée Chessy'],
};

let map, trainMarker, stopsGroup;
let currentNum = null, refreshTimer = null;
let panelExpanded = false;
let dragStartY = 0, dragStartTY = 0, isDragging = false;

function initMap() {
  map = L.map('map', { center: [46.8, 2.3], zoom: 6, zoomControl: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 18
  }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
}

function initDrag() {
  const panel = document.getElementById('panel');
  const zone  = document.getElementById('handleZone');

  function onStart(y) {
    isDragging = true; dragStartY = y;
    const m = (panel.style.transform||'').match(/translateY\((.+)px\)/);
    dragStartTY = m ? parseFloat(m[1]) : 0;
    panel.style.transition = 'none';
  }
  function onMove(y) {
    if (!isDragging) return;
    const next = Math.max(0, dragStartTY + (y - dragStartY));
    panel.style.transform = `translateY(${next}px)`;
  }
  function onEnd(y) {
    if (!isDragging) return;
    isDragging = false; panel.style.transition = '';
    const dy = y - dragStartY;
    if (dy < -40) expandPanel();
    else if (dy > 40) collapsePanel();
    else panelExpanded ? expandPanel() : collapsePanel();
  }

  zone.addEventListener('touchstart', e => onStart(e.touches[0].clientY), { passive: true });
  window.addEventListener('touchmove', e => { if (isDragging) { e.preventDefault(); onMove(e.touches[0].clientY); } }, { passive: false });
  window.addEventListener('touchend', e => onEnd(e.changedTouches[0].clientY));
  zone.addEventListener('mousedown', e => onStart(e.clientY));
  window.addEventListener('mousemove', e => onMove(e.clientY));
  window.addEventListener('mouseup', e => onEnd(e.clientY));
}

function expandPanel() { panelExpanded = true; const p = document.getElementById('panel'); p.classList.remove('peek'); p.classList.add('expanded'); }
function collapsePanel() { panelExpanded = false; const p = document.getElementById('panel'); p.classList.remove('expanded'); p.classList.add('peek'); }
function togglePanel() { panelExpanded ? collapsePanel() : expandPanel(); }

function fmtTime(ts) {
  if (!ts) return '—';
  return new Date(ts * 1000).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function fmtDelay(sec) {
  if (!sec) return null;
  const m = Math.round(sec / 60);
  return m === 0 ? null : m > 0 ? `+${m} min` : `${m} min`;
}
function setEx(n) { document.getElementById('trainInput').value = n; }

function getStopCoords(stopId) {
  if (!stopId) return null;
  const uic = stopId.replace(/\D/g,'').slice(-8);
  if (GARES[uic]) return { lat: GARES[uic][0], lng: GARES[uic][1], name: GARES[uic][2] };
  for (const [k,v] of Object.entries(GARES)) if (stopId.includes(k)) return { lat:v[0], lng:v[1], name:v[2] };
  return null;
}

function detectType(tripId) {
  if (/TGV|INOUI/i.test(tripId)) return 'TGV inOui';
  if (/OUIGO/i.test(tripId)) return 'OUIGO';
  if (/IC|INTERCIT/i.test(tripId)) return 'Intercités';
  if (/TER/i.test(tripId)) return 'TER';
  return 'Train';
}

async function fetchGTFSRT() {
  for (const url of [CORS_PROXY + encodeURIComponent(GTFS_RT_URL), GTFS_RT_URL]) {
    try {
      const r = await fetch(url, { signal: AbortSignal.timeout(15000) });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.arrayBuffer();
    } catch(e) { /* try next */ }
  }
  throw new Error('Flux SNCF inaccessible (CORS)');
}

function parseGTFSRT(buf) {
  const bytes = new Uint8Array(buf), view = new DataView(buf);
  let pos = 0;
  const entities = [];

  function rV() { let r=0,s=0; while(pos<bytes.length){const b=bytes[pos++];r|=(b&0x7F)<<s;if(!(b&0x80))break;s+=7;} return r; }
  function rS(l) { const v=new TextDecoder().decode(bytes.slice(pos,pos+l)); pos+=l; return v; }
  function skip(w) { if(w===0)rV(); else if(w===1)pos+=8; else if(w===2)pos+=rV(); else if(w===5)pos+=4; }

  function pSTE(end) { const e={}; while(pos<end){const t=rV(),f=t>>3,w=t&7; if(f===1&&w===0)e.delay=rV(); else if(f===2&&w===0)e.time=rV(); else skip(w);} return e; }
  function pSTU(end) { const s={}; while(pos<end){const t=rV(),f=t>>3,w=t&7; if(f===1&&w===0)s.stop_sequence=rV(); else if(f===3&&w===2)s.stop_id=rS(rV()); else if(f===2&&w===2){const l=rV();s.arrival=pSTE(pos+l);} else if(f===4&&w===2){const l=rV();s.departure=pSTE(pos+l);} else skip(w);} return s; }
  function pTD(end)  { const d={}; while(pos<end){const t=rV(),f=t>>3,w=t&7; if(f===1&&w===2)d.trip_id=rS(rV()); else if(f===4&&w===2)d.start_date=rS(rV()); else skip(w);} return d; }
  function pTU(end)  { const u={stop_time_update:[]}; while(pos<end){const t=rV(),f=t>>3,w=t&7; if(f===1&&w===2){const l=rV();u.trip=pTD(pos+l);} else if(f===2&&w===2){const l=rV();u.stop_time_update.push(pSTU(pos+l));} else if(f===4&&w===0)u.timestamp=rV(); else skip(w);} return u; }
  function pE(end)   { const e={}; while(pos<end){const t=rV(),f=t>>3,w=t&7; if(f===1&&w===2)e.id=rS(rV()); else if(f===3&&w===2){const l=rV();e.trip_update=pTU(pos+l);} else skip(w);} return e; }

  while(pos<bytes.length) {
    try { const t=rV(),f=t>>3,w=t&7; if(f===1&&w===2){pos+=rV();} else if(f===2&&w===2){const l=rV(),end=pos+l;entities.push(pE(end));pos=end;} else skip(w); }
    catch(e) { break; }
  }
  return entities;
}

function findTrain(entities, num) {
  const n = String(num).replace(/^0+/, '');
  for (const e of entities) {
    if (!e.trip_update?.trip?.trip_id) continue;
    if (e.trip_update.trip.trip_id.includes(n)) return e;
  }
  return null;
}

function computePosition(stops) {
  const now = Math.floor(Date.now() / 1000);
  let lastPassed = null, lastCoords = null, nextStop = null, nextCoords = null;

  for (const s of stops) {
    const t = s.departure?.time || s.arrival?.time;
    const c = getStopCoords(s.stop_id);
    if (!t || !c) continue;
    if (t <= now) { lastPassed = s; lastCoords = c; }
    else if (!nextStop) { nextStop = s; nextCoords = c; }
  }

  if (lastPassed && nextStop && lastCoords && nextCoords) {
    const dep = lastPassed.departure?.time || lastPassed.arrival?.time;
    const arr = nextStop.arrival?.time || nextStop.departure?.time;
    if (dep && arr && now >= dep && now <= arr) {
      const t = (now - dep) / (arr - dep);
      return {
        lat: lastCoords.lat + t * (nextCoords.lat - lastCoords.lat),
        lng: lastCoords.lng + t * (nextCoords.lng - lastCoords.lng),
        fromStop: lastCoords, toStop: nextCoords,
        progress: Math.round(t * 100), interpolated: true,
      };
    }
  }
  if (lastCoords) return { lat: lastCoords.lat, lng: lastCoords.lng, fromStop: lastCoords, interpolated: false, progress: null };
  if (nextCoords) return { lat: nextCoords.lat, lng: nextCoords.lng, toStop: nextCoords, interpolated: false, pending: true, progress: 0 };
  return null;
}

function renderMap(stops, pos) {
  if (trainMarker) { map.removeLayer(trainMarker); trainMarker = null; }
  if (stopsGroup)  { map.removeLayer(stopsGroup); }
  stopsGroup = L.layerGroup().addTo(map);

  const now = Math.floor(Date.now() / 1000);

  stops.forEach((s, i) => {
    const c = getStopCoords(s.stop_id);
    if (!c) return;
    const isT = i === 0 || i === stops.length - 1;
    const t   = s.arrival?.time || s.departure?.time;
    const passed = t && t < now;
    const delay = fmtDelay(s.arrival?.delay || s.departure?.delay || 0);

    const icon = L.divIcon({
      className: '',
      html: `<div class="stop-dot-map ${isT?'terminus':''} ${passed?'passed':''}"></div>`,
      iconSize: isT ? [14,14] : [10,10],
      iconAnchor: isT ? [7,7] : [5,5],
    });

    L.marker([c.lat, c.lng], { icon })
      .bindPopup(`<div class="pu-name">${c.name}</div>
                  <div class="pu-t">Arr ${fmtTime(s.arrival?.time)} · Dép ${fmtTime(s.departure?.time)}</div>
                  ${delay ? `<div class="pu-d">${delay}</div>` : ''}`)
      .addTo(stopsGroup);
  });

  if (pos) {
    const sub = pos.interpolated
      ? `En route → ${pos.toStop?.name||'?'} (${pos.progress}%)`
      : pos.pending ? `Avant départ : ${pos.toStop?.name||'?'}`
      : `Dernière gare : ${pos.fromStop?.name||'?'}`;

    const icon = L.divIcon({
      className: '',
      html: `<div class="train-pin"></div>`,
      iconSize: [28,28], iconAnchor: [14,14],
    });
    trainMarker = L.marker([pos.lat, pos.lng], { icon, zIndexOffset: 1000 })
      .bindPopup(`<div class="pu-name">🚄 Train ${currentNum}</div><div class="pu-t">${sub}</div>`)
      .addTo(map);

    map.flyTo([pos.lat, pos.lng], 9, { animate: true, duration: 1.2 });
  }
}

function renderPanel(entity, stops) {
  const tripId = entity.trip_update.trip.trip_id;
  const type   = detectType(tripId);
  const now    = Math.floor(Date.now() / 1000);

  const withC = stops.filter(s => getStopCoords(s.stop_id));
  const first = withC[0], last = withC[withC.length-1];
  const origin = first ? getStopCoords(first.stop_id).name : '—';
  const dest   = last  ? getStopCoords(last.stop_id).name  : '—';

  const lastSTU = stops.slice(-1)[0];
  const delayMins = Math.round((lastSTU?.arrival?.delay || lastSTU?.departure?.delay || 0) / 60);
  const delayLabel = delayMins === 0 ? 'À l\'heure' : delayMins > 0 ? `+${delayMins} min` : `${delayMins} min`;
  const delayClass = delayMins <= 0 ? 'ok' : delayMins <= 5 ? 'warn' : 'danger';

  const pos = computePosition(stops);

  // Peek
  document.getElementById('badgeNum').textContent = currentNum;
  document.getElementById('peekRoute').textContent = `${origin} → ${dest}`;
  document.getElementById('peekStatus').textContent = `${type} · ${pos?.interpolated ? 'En route' : pos?.pending ? 'Avant départ' : 'Données reçues'}`;
  const chip = document.getElementById('delayChip');
  chip.style.display = ''; chip.className = `delay-chip ${delayClass}`; chip.textContent = delayLabel;

  // Position card
  let posHtml = '';
  if (pos) {
    const ico   = pos.interpolated ? '🚄' : pos.pending ? '🚉' : '📍';
    const title = pos.interpolated
      ? `En route vers ${pos.toStop?.name||'?'}`
      : pos.pending ? `En gare (avant départ) : ${pos.toStop?.name||'?'}`
      : `Dernière gare : ${pos.fromStop?.name||'?'}`;
    const sub = pos.interpolated
      ? `Position interpolée · ${pos.progress}% du trajet effectué`
      : pos.pending ? 'Train pas encore parti'
      : 'Position sur la dernière gare connue';
    const prog = pos.progress !== null
      ? `<div class="pos-prog"><div class="pos-prog-fill" style="width:${pos.progress}%"></div></div>` : '';

    posHtml = `<div class="sec-label">Position</div>
      <div class="pos-card">
        <div class="pos-ico">${ico}</div>
        <div class="pos-body">
          <div class="pos-title">${title}</div>
          <div class="pos-sub">${sub}</div>
          ${prog}
        </div>
      </div>`;
  }

  // Current stop index
  let curIdx = 0;
  for (let i = 0; i < stops.length; i++) {
    const t = stops[i].departure?.time || stops[i].arrival?.time;
    if (t && t < now) curIdx = i;
  }

  const stopsHtml = stops.map((s, i) => {
    const c = getStopCoords(s.stop_id);
    const name = c ? c.name : `Gare ${i+1}`;
    const arrT = s.arrival?.time, depT = s.departure?.time;
    const delay = fmtDelay(s.arrival?.delay || s.departure?.delay || 0);
    const isLast = i === stops.length - 1;
    let cls = i < curIdx ? 'passed' : i === curIdx ? 'current' : 'future';

    return `<div class="stop-row">
      <div class="stop-tl">
        <div class="stop-circle ${cls}"></div>
        ${!isLast ? `<div class="stop-vline ${i < curIdx ? 'passed' : ''}"></div>` : ''}
      </div>
      <div class="stop-name-t ${cls}">${name}</div>
      <div class="stop-times-t">
        <div class="stop-time-v">${arrT ? fmtTime(arrT) : depT ? fmtTime(depT) : '—'}</div>
        ${delay ? `<div class="stop-delay-v">${delay}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('panelScroll').innerHTML = `
    <div class="section">
      ${posHtml}
      <div class="sec-label">Arrêts · ${stops.length} gares</div>
      ${stopsHtml}
    </div>`;

  document.getElementById('panelFooter').style.display = 'flex';
  document.getElementById('footerInfo').textContent = `Maj ${new Date().toLocaleTimeString('fr-FR')} · GTFS-RT SNCF`;

  renderMap(stops, pos);
  collapsePanel(); // afficher le panneau en position peek avec les infos
}

async function startTracking() {
  const val = document.getElementById('trainInput').value.trim();
  if (!val) return;
  currentNum = val;
  document.getElementById('searchBtn').disabled = true;
  document.getElementById('badgeNum').textContent = val;
  document.getElementById('peekRoute').textContent = 'Recherche en cours…';
  document.getElementById('peekStatus').textContent = 'Flux GTFS-RT SNCF';
  document.getElementById('delayChip').style.display = 'none';
  document.getElementById('panelScroll').innerHTML = `<div class="section"><div class="panel-msg"><div class="spinner"></div>Interrogation transport.data.gouv.fr…</div></div>`;
  document.getElementById('panelFooter').style.display = 'none';
  collapsePanel();
  if (refreshTimer) clearInterval(refreshTimer);
  await fetchAndDisplay();
  refreshTimer = setInterval(fetchAndDisplay, 120000);
}

async function refreshData() {
  if (!currentNum) return;
  await fetchAndDisplay();
}

async function fetchAndDisplay() {
  try {
    const buf = await fetchGTFSRT();
    const entities = parseGTFSRT(buf);
    const entity = findTrain(entities, currentNum);

    if (!entity) {
      document.getElementById('peekRoute').textContent = `Train ${currentNum} non trouvé`;
      document.getElementById('peekStatus').textContent = `${entities.length} trains dans le flux actuel`;
      document.getElementById('panelScroll').innerHTML = `<div class="section"><div class="panel-msg">
        <div class="ico">🔍</div>
        <strong>Train ${currentNum} introuvable</strong><br><br>
        Circule-t-il dans les 60 prochaines minutes ?<br>Le flux SNCF ne couvre que la fenêtre ±60 min.<br><br>
        <span style="font-size:11px;color:var(--muted)">${entities.length} trains présents dans le flux</span>
      </div></div>`;
      document.getElementById('panelFooter').style.display = 'flex';
      document.getElementById('footerInfo').textContent = `${new Date().toLocaleTimeString('fr-FR')} · ${entities.length} trains`;
    } else {
      const stops = entity.trip_update.stop_time_update || [];
      renderPanel(entity, stops);
    }
  } catch(e) {
    document.getElementById('peekRoute').textContent = 'Erreur connexion';
    document.getElementById('peekStatus').textContent = e.message;
    document.getElementById('panelScroll').innerHTML = `<div class="section"><div class="panel-msg">
      <div class="ico">⚠️</div><strong>Données inaccessibles</strong><br><br>
      ${e.message}<br><br>
      <span style="font-size:11px;color:var(--muted)">
      Le flux GTFS-RT peut être bloqué par le navigateur (CORS).<br>
      Accès direct : proxy.transport.data.gouv.fr
      </span>
    </div></div>`;
  }
  document.getElementById('searchBtn').disabled = false;
}

document.getElementById('trainInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { document.getElementById('trainInput').blur(); startTracking(); }
});

initMap();
initDrag();
</script>
