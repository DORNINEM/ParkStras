
<!DOCTYPE html>

<head>

    <title>Quiz sur les alarmes</title>

            font-family: Arial, sans-serif;

</head>
<body>
    <h1>Quiz sur les alarmes</h1>
    <div id="quiz"></div>
    <div id="result"></div>
    
    <script>
        const quizData = {
            "quiz": {
                "questions": []
            }
        };

        // Embed the quiz data directly in the script
        quizData.quiz.questions = {
            questions: [{"question": "Quelle est la principale fonction du 'code ma\u00eetre' sur le clavier du syst\u00e8me d'alarme ?", "answerOptions": [{"text": "Mettre en marche et \u00e0 l'arr\u00eat le syst\u00e8me uniquement pour des zones sp\u00e9cifiques.", "rationale": "Cette fonction est typiquement associ\u00e9e \u00e0 un 'code utilisateur' dont les droits d'acc\u00e8s peuvent \u00eatre limit\u00e9s \u00e0 certaines zones.", "isCorrect": false}, {"text": "D\u00e9clencher une alerte silencieuse vers le centre de surveillance en cas de contrainte.", "rationale": "Ceci d\u00e9crit la fonction du 'code sous contrainte', qui signale une situation de danger sans d\u00e9clencher d'alarme sonore sur place.", "isCorrect": false}, {"text": "Permettre l'utilisation de toutes les fonctions, y compris la programmation et la cr\u00e9ation d'autres codes.", "rationale": "Le code ma\u00eetre est le code principal qui donne un acc\u00e8s complet \u00e0 la configuration du syst\u00e8me, comme la cr\u00e9ation des codes utilisateurs.", "isCorrect": true}, {"text": "Arr\u00eater la sir\u00e8ne apr\u00e8s un d\u00e9clenchement accidentel sans contacter le centre de surveillance.", "rationale": "Bien qu'il puisse arr\u00eater la sir\u00e8ne, sa fonction principale est bien plus \u00e9tendue et l'arr\u00eat de la sir\u00e8ne n'annule pas la transmission de l'alerte.", "isCorrect": false}], "hint": "Pensez au niveau d'acc\u00e8s le plus \u00e9lev\u00e9 n\u00e9cessaire pour g\u00e9rer les autres utilisateurs du syst\u00e8me."}, {"question": "Que se passe-t-il si un utilisateur saisit 3 fois de suite un code erron\u00e9 sur le clavier ?", "answerOptions": [{"text": "Le clavier se verrouille d\u00e9finitivement et doit \u00eatre remplac\u00e9 par un technicien.", "rationale": "Le verrouillage n'est que temporaire pour des raisons de s\u00e9curit\u00e9, un remplacement n'est pas n\u00e9cessaire.", "isCorrect": false}, {"text": "Un email est envoy\u00e9 \u00e0 l'utilisateur principal pour l'informer des tentatives d'acc\u00e8s.", "rationale": "La r\u00e9action du syst\u00e8me est imm\u00e9diate et plus active qu'un simple email ; une alarme est d\u00e9clench\u00e9e.", "isCorrect": false}, {"text": "La sir\u00e8ne se d\u00e9clenche et le clavier se bloque pendant 3 minutes.", "rationale": "Le syst\u00e8me interpr\u00e8te cette action comme une tentative d'intrusion, d\u00e9clenchant ainsi la sir\u00e8ne et un blocage temporaire du clavier.", "isCorrect": true}, {"text": "Le syst\u00e8me envoie une demande de r\u00e9initialisation de mot de passe sur l'application mobile.", "rationale": "La proc\u00e9dure de s\u00e9curit\u00e9 en cas de codes erron\u00e9s est locale et imm\u00e9diate, impliquant le d\u00e9clenchement de la sir\u00e8ne.", "isCorrect": false}], "hint": "Consid\u00e9rez comment le syst\u00e8me r\u00e9agirait \u00e0 une tentative potentielle de forcer l'acc\u00e8s."}, {"question": "Quelle est la particularit\u00e9 de la 't\u00e9l\u00e9commande biom\u00e9trique' par rapport \u00e0 la t\u00e9l\u00e9commande standard ?", "answerOptions": [{"text": "Elle permet de contr\u00f4ler le syst\u00e8me d'alarme \u00e0 une plus grande distance.", "rationale": "La port\u00e9e radio est similaire pour les diff\u00e9rents types de t\u00e9l\u00e9commandes.", "isCorrect": false}, {"text": "Sa touche de mise \u00e0 l'arr\u00eat requiert la reconnaissance d'une empreinte digitale.", "rationale": "La s\u00e9curisation de la mise \u00e0 l'arr\u00eat par un capteur d'empreinte digitale est la caract\u00e9ristique distinctive de ce mod\u00e8le.", "isCorrect": true}, {"text": "Elle poss\u00e8de une batterie rechargeable alors que la standard utilise des piles.", "rationale": "Le document n'indique pas de diff\u00e9rence de type d'alimentation, les deux mod\u00e8les utilisant des piles.", "isCorrect": false}, {"text": "Elle peut d\u00e9clencher une alarme silencieuse, ce que la t\u00e9l\u00e9commande standard ne peut pas faire.", "rationale": "Les deux types de t\u00e9l\u00e9commandes disposent d'un bouton d'alerte dont le comportement (silencieux ou non) d\u00e9pend du param\u00e9trage du syst\u00e8me.", "isCorrect": false}], "hint": "Le nom 'biom\u00e9trique' fait r\u00e9f\u00e9rence \u00e0 une caract\u00e9ristique physique unique de l'utilisateur."}, {"question": "Dans quel cas les d\u00e9tecteurs de mouvement 'photo' V3 prennent-ils des photos ?", "answerOptions": [{"text": "Uniquement lorsque l'utilisateur en fait la demande via l'application mobile.", "rationale": "La prise de photo est un processus automatique en r\u00e9ponse \u00e0 un \u00e9v\u00e9nement, non une commande manuelle \u00e0 distance en conditions normales.", "isCorrect": false}, {"text": "\u00c0 intervalles r\u00e9guliers pour v\u00e9rifier le bon fonctionnement de l'appareil.", "rationale": "Les tests de fonctionnement sont effectu\u00e9s diff\u00e9remment et ne n\u00e9cessitent pas la prise de photos.", "isCorrect": false}, {"text": "En cas de d\u00e9tection de mouvement ou lors d'une alerte (touche alerte, fum\u00e9e, CO).", "rationale": "La fonction photo est activ\u00e9e par les d\u00e9clenchements d'alarme pour aider \u00e0 la lev\u00e9e de doute, que l'alarme provienne d'une intrusion ou d'un autre type de d\u00e9tecteur.", "isCorrect": true}, {"text": "Seulement si le syst\u00e8me est en mode 'marche totale'.", "rationale": "La prise de photo est \u00e9galement active lors d'alertes d\u00e9clench\u00e9es m\u00eame quand le syst\u00e8me est \u00e0 l'arr\u00eat, comme avec la touche alerte ou les d\u00e9tecteurs de risques domestiques.", "isCorrect": false}], "hint": "Pensez \u00e0 l'objectif de la fonction 'photo' : fournir des informations visuelles lors d'un \u00e9v\u00e9nement critique."}, {"question": "Quelle est la puissance sonore des sir\u00e8nes int\u00e9rieure et ext\u00e9rieure ?", "answerOptions": [{"text": "85 d\u00e9cibels", "rationale": "85 d\u00e9cibels est le niveau sonore typique du buzzer int\u00e9gr\u00e9 \u00e0 un d\u00e9tecteur de monoxyde de carbone, pas de la sir\u00e8ne principale.", "isCorrect": false}, {"text": "120 d\u00e9cibels", "rationale": "Ce niveau sonore est sup\u00e9rieur \u00e0 celui indiqu\u00e9 dans le document pour les sir\u00e8nes du syst\u00e8me.", "isCorrect": false}, {"text": "90 d\u00e9cibels", "rationale": "Ce niveau sonore correspond au buzzer d'un d\u00e9tecteur de fum\u00e9e et est inf\u00e9rieur \u00e0 la puissance de la sir\u00e8ne d'alarme.", "isCorrect": false}, {"text": "105 d\u00e9cibels", "rationale": "Le document sp\u00e9cifie que les deux sir\u00e8nes, int\u00e9rieure et ext\u00e9rieure, \u00e9mettent un signal sonore puissant de 105 d\u00e9cibels pour dissuader l'intrus.", "isCorrect": true}], "hint": "Le manuel mentionne un chiffre pr\u00e9cis pour la puissance des sir\u00e8nes, con\u00e7u pour \u00eatre tr\u00e8s dissuasif."}, {"question": "Quel est l'avantage de la 'protection par zone' ?", "answerOptions": [{"text": "Elle permet d'augmenter la puissance du signal radio dans certaines parties de la maison.", "rationale": "La protection par zone concerne la logique de d\u00e9tection et non la puissance de transmission des \u00e9quipements.", "isCorrect": false}, {"text": "Elle active diff\u00e9rentes sir\u00e8nes en fonction de l'endroit o\u00f9 l'intrusion a lieu.", "rationale": "La gestion des zones permet de d\u00e9finir quels d\u00e9tecteurs sont actifs, mais ne modifie pas le comportement des sir\u00e8nes.", "isCorrect": false}, {"text": "Elle permet de prot\u00e9ger une partie de l'habitation tout en se trouvant dans une autre partie.", "rationale": "Cette fonction offre la flexibilit\u00e9 de mettre en marche l'alarme dans des zones inoccup\u00e9es (ex: garage, rez-de-chauss\u00e9e) pendant que les habitants occupent d'autres zones.", "isCorrect": true}, {"text": "Elle attribue automatiquement un code clavier diff\u00e9rent pour chaque membre de la famille.", "rationale": "La gestion des codes est une fonction distincte, bien qu'il soit possible de lier des codes utilisateurs \u00e0 des zones sp\u00e9cifiques.", "isCorrect": false}], "hint": "Cette fonction est particuli\u00e8rement utile la nuit ou lorsque vous \u00eates pr\u00e9sent \u00e0 votre domicile."}, {"question": "Quelle action le centre de surveillance entreprend-il en premier lieu en cas d'alarme pour intoxication aigu\u00eb au monoxyde de carbone ?", "answerOptions": [{"text": "Il envoie un agent de s\u00e9curit\u00e9 pour v\u00e9rifier la situation.", "rationale": "Une alarme de monoxyde de carbone est un risque vital qui n\u00e9cessite une intervention des services d'urgence, pas d'un agent de s\u00e9curit\u00e9.", "isCorrect": false}, {"text": "Il vous alerte par un appel t\u00e9l\u00e9phonique pour vous demander d'\u00e9vacuer et appelle les pompiers.", "rationale": "Face \u00e0 un risque d'intoxication aigu\u00eb, la priorit\u00e9 est d'assurer la s\u00e9curit\u00e9 des occupants en les faisant \u00e9vacuer et en pr\u00e9venant les secours comp\u00e9tents.", "isCorrect": true}, {"text": "Il envoie un SMS et un email avec les mesures de s\u00e9curit\u00e9 \u00e0 prendre.", "rationale": "L'envoi de SMS et d'email est la proc\u00e9dure pour le niveau 'pr\u00e9-alarme' (intoxication chronique), pas pour le niveau 'alarme' (intoxication aigu\u00eb).", "isCorrect": false}, {"text": "Il d\u00e9sactive \u00e0 distance le syst\u00e8me de chauffage de la maison.", "rationale": "Le centre de surveillance n'a pas la capacit\u00e9 technique d'interagir avec les autres appareils domestiques comme le chauffage.", "isCorrect": false}], "hint": "Pensez \u00e0 la gravit\u00e9 d'une intoxication aigu\u00eb et \u00e0 la r\u00e9ponse la plus appropri\u00e9e pour ce type d'urgence m\u00e9dicale."}, {"question": "\u00c0 quoi sert la 'carte de cl\u00e9s personnelles' mentionn\u00e9e dans la section 'La Vid\u00e9o' ?", "answerOptions": [{"text": "\u00c0 d\u00e9sarmer le syst\u00e8me d'alarme si on a oubli\u00e9 son code.", "rationale": "La carte n'est pas un moyen de commander le syst\u00e8me d'alarme mais de s\u00e9curiser l'acc\u00e8s \u00e0 une fonction sp\u00e9cifique.", "isCorrect": false}, {"text": "\u00c0 s'identifier pour acc\u00e9der \u00e0 la vid\u00e9o en direct depuis l'espace abonn\u00e9.", "rationale": "Cette carte ajoute une couche de s\u00e9curit\u00e9 pour garantir que seul l'utilisateur autoris\u00e9 puisse visionner les flux vid\u00e9o en direct.", "isCorrect": true}, {"text": "\u00c0 stocker les enregistrements vid\u00e9o en cas de coupure internet.", "rationale": "La carte de cl\u00e9s personnelles est un outil d'authentification, non un support de stockage physique.", "isCorrect": false}, {"text": "\u00c0 commander l'allumage des LED de la cam\u00e9ra \u00e0 distance.", "rationale": "L'allumage des LED se fait via l'interface de l'espace abonn\u00e9 ou de l'application, apr\u00e8s s'\u00eatre identifi\u00e9.", "isCorrect": false}], "hint": "Cette carte est un syst\u00e8me de s\u00e9curit\u00e9 suppl\u00e9mentaire pour une fonction qui touche \u00e0 la vie priv\u00e9e."}, {"question": "Quelle est la recommandation principale concernant l'alimentation \u00e9lectrique et la box Internet avant une absence prolong\u00e9e ?", "answerOptions": [{"text": "Couper l'\u00e9lectricit\u00e9 et la box Internet pour faire des \u00e9conomies d'\u00e9nergie.", "rationale": "Le manuel met en garde sp\u00e9cifiquement contre cette action car elle romprait la communication avec le centre de surveillance.", "isCorrect": false}, {"text": "Mettre la box Internet en mode veille pour r\u00e9duire la consommation.", "rationale": "Le mode veille pourrait interrompre la connexion n\u00e9cessaire \u00e0 la t\u00e9l\u00e9surveillance, il est donc conseill\u00e9 de laisser la box pleinement fonctionnelle.", "isCorrect": false}, {"text": "Ne surtout pas couper l'\u00e9lectricit\u00e9 ni la box Internet.", "rationale": "Le maintien de ces deux \u00e9l\u00e9ments est crucial pour que le syst\u00e8me d'alarme puisse communiquer les alertes au centre de surveillance.", "isCorrect": true}, {"text": "D\u00e9brancher la centrale de la prise \u00e9lectrique pour la faire passer sur sa batterie de secours.", "rationale": "La batterie de secours n'est pr\u00e9vue que pour les coupures de courant impr\u00e9vues et a une autonomie limit\u00e9e ; la liaison principale doit rester l'alimentation secteur.", "isCorrect": false}], "hint": "Pensez \u00e0 ce qui est n\u00e9cessaire pour que le syst\u00e8me puisse communiquer une alerte \u00e0 l'ext\u00e9rieur de la maison."}, {"question": "Comment le syst\u00e8me indique-t-il visuellement qu'un d\u00e9faut technique a \u00e9t\u00e9 d\u00e9cel\u00e9 et n'est pas solutionn\u00e9 ?", "answerOptions": [{"text": "Le t\u00e9moin de zone s'allume en orange fixe.", "rationale": "Un t\u00e9moin de zone orange indique une mise en marche partielle, pas un d\u00e9faut technique.", "isCorrect": false}, {"text": "La LED d'\u00e9clairage de la t\u00e9l\u00e9commande clignote en continu.", "rationale": "Un clignotement de la LED de la t\u00e9l\u00e9commande lors de la mise en marche signale un d\u00e9faut, mais l'indicateur permanent se trouve sur le clavier.", "isCorrect": false}, {"text": "L'un des indicateurs d'\u00e9tat du clavier clignote en rouge.", "rationale": "Le clignotement rouge de l'indicateur d'\u00e9tat sp\u00e9cifique (symbole de cl\u00e9 \u00e0 molette) signale un d\u00e9faut technique persistant.", "isCorrect": true}, {"text": "Les quatre t\u00e9moins de zone du clavier clignotent simultan\u00e9ment.", "rationale": "Le clignotement simultan\u00e9 des t\u00e9moins de zone indique une commande erron\u00e9e, non un d\u00e9faut technique du mat\u00e9riel.", "isCorrect": false}], "hint": "Le manuel d\u00e9crit plusieurs indicateurs lumineux sur le clavier, chacun ayant une signification pr\u00e9cise."}]
        };

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const questionData = quizData.quiz.questions.questions[currentQuestion];
            const quizDiv = document.getElementById('quiz');
            
            let questionHTML = `<div class="question">`;
            questionHTML += `<h2>Question ${currentQuestion + 1}: ${questionData.question}</h2>`;
            questionHTML += `<div class="options">`;

            questionData.answerOptions.forEach((option, index) => {
                questionHTML += `<div class="option">`;
                questionHTML += `<input type="radio" id="option${index}" name="question${currentQuestion}" value="${option.isCorrect}">`;
                questionHTML += `<label for="option${index}">${option.text}</label>`;
                questionHTML += `</div>`;
            });

            questionHTML += `</div>`;
            questionHTML += `</div>`;
            questionHTML += `<button onclick="checkAnswer()">Suivant</button>`;

            quizDiv.innerHTML = questionHTML;
        }

        function checkAnswer() {
            const selectedOption = document.querySelector(`input[name="question${currentQuestion}"]:checked`);
            if (selectedOption) {
                if (selectedOption.value === 'true') {
                    score++;
                }
                currentQuestion++;
                if (currentQuestion < quizData.quiz.questions.questions.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            } else {
                alert('Veuillez sélectionner une réponse.');
            }
        }

        function showResult() {
            const resultDiv = document.getElementById('result');
            let appreciation;
            if (score === quizData.quiz.questions.questions.length) {
                appreciation = "Félicitations! Vous avez un score parfait!";
            } else if (score >= quizData.quiz.questions.questions.length / 2) {
                appreciation = "Bien joué! Vous avez une bonne compréhension du sujet.";
            } else {
                appreciation = "Vous pouvez faire mieux! Revoyez le sujet et réessayez.";
            }
            resultDiv.innerHTML = `<h2>Votre score: ${score} / ${quizData.quiz.questions.questions.length}</h2><p>${appreciation}</p>`;
        }

        // Load quiz data and start the quiz
        window.onload = function() {
            loadQuestion();
        };
    </script>
