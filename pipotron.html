<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 PIPOTRON 3000 🎰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.1s;
        }

        .flash-overlay.active {
            opacity: 0.9;
        }

        h1 {
            text-align: center;
            color: #764ba2;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            text-align: center;
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 30px;
            font-style: italic;
        }

        .selector {
            margin-bottom: 30px;
            text-align: center;
        }

        .selector label {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
            margin-right: 10px;
        }

        select {
            padding: 10px 20px;
            font-size: 1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover {
            border-color: #764ba2;
            transform: translateY(-2px);
        }

        .result-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .result-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .result-text {
            color: white;
            font-size: 1.5em;
            text-align: center;
            line-height: 1.6;
            font-weight: 500;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .result-text.generating {
            animation: textGlow 0.5s infinite;
        }

        @keyframes textGlow {
            0%, 100% { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); }
            50% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 2px 2px 4px rgba(0, 0, 0, 0.3); }
        }

        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .generate-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
        }

        .generate-btn:active {
            transform: translateY(-1px);
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:active::before {
            width: 300px;
            height: 300px;
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            opacity: 0;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .stats {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.9em;
        }

        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .rainbow-mode {
            animation: rainbow 3s linear infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.5s;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            
            .result-text {
                font-size: 1.2em;
            }
            
            button {
                padding: 12px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = '100%';
                    particle.style.animation = `particleFloat ${1 + Math.random()}s ease-out forwards`;
                    container.appendChild(particle);
                    
                    setTimeout(() => particle.remove(), 1500);
                }, i * 50);
            }
        }

        function flashEffect() {
            const flash = document.getElementById('flashOverlay');
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 100);
            
            setTimeout(() => {
                flash.classList.add('active');
                setTimeout(() => flash.classList.remove('active'), 100);
            }, 200);
        }

        function shakeContainer() {
            const container = document.getElementById('container');
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 500);
        }

        function generatePipotron() {
            const theme = document.getElementById('themeSelect').value;
            const data = pipotronData[theme];
            const resultText = document.getElementById('resultText');
            
            // Effets visuels
            flashEffect();
            shakeContainer();
            createParticles();
            
            // Animation de génération
            resultText.classList.add('generating');
            resultText.textContent = '⚡ GÉNÉRATION EN COURS ⚡';
            
            // Mode rainbow temporaire
            const container = document.getElementById('container');
            container.classList.add('rainbow-mode');
            
            setTimeout(() => {
                // Génération du pipotron
                let result = '';
                for (let i = 1; i <= 8; i++) {
                    const section = data[`section${i}`];
                    if (section && section.length > 0) {
                        result += getRandom(section) + ' ';
                    }
                }
                
                resultText.textContent = result.trim();
                resultText.classList.remove('generating');
                container.classList.remove('rainbow-mode');
                
                // Mise à jour du compteur
                generatedCount++;
                document.getElementById('stats').innerHTML = 
                    `Pipotrons générés : <strong>${generatedCount}</strong> 🔥`;
                
            }, 800);
        }
