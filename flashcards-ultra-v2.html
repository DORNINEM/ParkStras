<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - HOMIRIS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00a3e0 0%, #005b9a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .app {
            width: 100%;
            max-width: 700px;
        }

        /* MINI HEADER */
        .mini-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.95);
            padding: 5px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .brand img {
            height: 22px;
        }

        .brand span {
            font-size: 0.8em;
            font-weight: 600;
            color: #333;
        }

        .tools {
            display: flex;
            gap: 5px;
        }

        .tool-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.95);
            cursor: pointer;
            font-size: 0.9em;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: all 0.2s;
        }

        .tool-btn:hover {
            transform: scale(1.08);
        }

        .tool-btn:active {
            transform: scale(0.95);
        }

        input[type="file"] {
            display: none;
        }

        /* MODAL FILE LIST */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 25px;
            max-width: 450px;
            width: 90%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .modal-title {
            font-size: 1.2em;
            color: #00a3e0;
            font-weight: 700;
        }

        .modal-close {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            font-size: 1.2em;
            color: #666;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: #e0e0e0;
            transform: scale(1.1);
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-item {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid transparent;
        }

        .file-item:hover {
            background: #e9ecef;
            border-color: #00a3e0;
            transform: translateX(5px);
        }

        .file-icon {
            font-size: 1.2em;
        }

        .file-name {
            flex: 1;
            font-size: 0.9em;
            color: #333;
            font-weight: 500;
        }

        .file-badge {
            background: #00a3e0;
            color: white;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.7em;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .empty-state-text {
            font-size: 0.9em;
        }

        .modal-footer {
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
            display: flex;
            justify-content: center;
        }

        .upload-btn {
            background: #00a3e0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-btn:hover {
            background: #005b9a;
            transform: translateY(-2px);
        }

        /* CARD */
        .card-zone {
            perspective: 1200px;
        }

        .card-wrap {
            width: 100%;
            height: 480px;
            display: none;
        }

        .card-wrap.active {
            display: block;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card.flip {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 18px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .front {
            background: white;
        }

        .back {
            background: linear-gradient(135deg, #00a3e0 0%, #005b9a 100%);
            color: white;
            transform: rotateY(180deg);
        }

        /* CARD HEADER */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .type-badge {
            background: rgba(0, 163, 224, 0.12);
            color: #00a3e0;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.65em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .back .type-badge {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .card-stats {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .mini-stat {
            background: rgba(0, 0, 0, 0.05);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.7em;
            font-weight: 600;
            color: #666;
        }

        .back .mini-stat {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .position-badge {
            background: rgba(0, 0, 0, 0.05);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            font-weight: 700;
            color: #999;
        }

        .back .position-badge {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* CARD BODY */
        .card-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .card-content {
            font-size: 1.25em;
            line-height: 1.6;
            text-align: center;
            color: #2c3e50;
        }

        .back .card-content {
            color: white;
        }

        /* CARD FOOTER */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .back .card-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hint {
            font-size: 0.7em;
            color: #aaa;
            font-style: italic;
        }

        .back .hint {
            color: rgba(255, 255, 255, 0.7);
        }

        .progress-mini {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-text {
            font-size: 0.7em;
            font-weight: 600;
            color: #999;
        }

        .back .progress-text {
            color: rgba(255, 255, 255, 0.8);
        }

        .progress-dots {
            display: flex;
            gap: 3px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.1);
        }

        .dot.active {
            background: #00a3e0;
        }

        .back .dot {
            background: rgba(255, 255, 255, 0.2);
        }

        .back .dot.active {
            background: white;
        }

        /* WELCOME */
        .welcome {
            background: white;
            border-radius: 18px;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        .welcome h2 {
            color: #00a3e0;
            font-size: 2em;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #666;
            font-size: 1em;
        }

        /* NAV */
        .nav-bar {
            display: none;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .nav-bar.active {
            display: flex;
        }

        .nav-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.95);
            color: #00a3e0;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: all 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: #00a3e0;
            color: white;
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .card-wrap {
                height: 400px;
            }

            .card-content {
                font-size: 1.1em;
            }

            .card-stats {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- MINI HEADER -->
        <div class="mini-header">
            <div class="brand">
                <img src="logo-homiris.png" alt="HOMIRIS">
                <span>Flashcards</span>
            </div>
            <div class="tools">
                <input type="file" id="file" accept=".json" />
                <button class="tool-btn" id="fileListBtn" title="Liste des fichiers">📁</button>
                <button class="tool-btn" id="shuffle" style="display:none;">🔀</button>
                <button class="tool-btn" id="restart" style="display:none;">↺</button>
            </div>
        </div>

        <!-- MODAL FILE LIST -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-header">
                    <div class="modal-title">📁 Fichiers disponibles</div>
                    <button class="modal-close" id="modalClose">×</button>
                </div>
                <div class="modal-body">
                    <div class="file-list" id="fileList"></div>
                </div>
                <div class="modal-footer">
                    <button class="upload-btn" onclick="document.getElementById('file').click()">
                        📤 Charger un autre fichier
                    </button>
                </div>
            </div>
        </div>

        <!-- CARD ZONE -->
        <div class="card-zone">
            <div class="welcome" id="welcome">
                <h2>📚 Flashcards</h2>
                <p>Chargez vos cartes pour commencer</p>
            </div>

            <div class="card-wrap" id="cardWrap">
                <div class="card" id="card">
                    <!-- FRONT -->
                    <div class="face front">
                        <div class="card-header">
                            <div class="type-badge">Question</div>
                            <div class="card-stats">
                                <div class="mini-stat">📚 <span id="totalF">0</span></div>
                                <div class="mini-stat">👁️ <span id="viewedF">0</span></div>
                                <div class="mini-stat">🔄 <span id="flipF">0</span></div>
                                <div class="position-badge" id="posF">1</div>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="card-content" id="contentF"></div>
                        </div>
                        <div class="card-footer">
                            <div class="hint">👆 Cliquez pour la réponse</div>
                            <div class="progress-mini">
                                <span class="progress-text" id="progTextF">1/0</span>
                                <div class="progress-dots" id="dotsF"></div>
                            </div>
                        </div>
                    </div>

                    <!-- BACK -->
                    <div class="face back">
                        <div class="card-header">
                            <div class="type-badge">Réponse</div>
                            <div class="card-stats">
                                <div class="mini-stat">📚 <span id="totalB">0</span></div>
                                <div class="mini-stat">👁️ <span id="viewedB">0</span></div>
                                <div class="mini-stat">🔄 <span id="flipB">0</span></div>
                                <div class="position-badge" id="posB">1</div>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="card-content" id="contentB"></div>
                        </div>
                        <div class="card-footer">
                            <div class="hint">👆 Cliquez pour revenir</div>
                            <div class="progress-mini">
                                <span class="progress-text" id="progTextB">1/0</span>
                                <div class="progress-dots" id="dotsB"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- NAV -->
        <div class="nav-bar" id="navBar">
            <button class="nav-btn" id="prev" disabled>◀</button>
            <button class="nav-btn" id="next">▶</button>
        </div>
    </div>

    <script>
        let cards = [];
        let idx = 0;
        let viewed = new Set();
        let flips = 0;
        let availableFiles = [];

        // Détecter les fichiers FC*.json disponibles
        async function detectFiles() {
            availableFiles = [];
            
            // Liste des fichiers à vérifier (vous pouvez ajouter vos propres fichiers ici)
            const possibleFiles = [
                'FC_Alarmes.json',
                'FC_Securite.json',
                'FC_Video.json',
                'FC_General.json',
                'FC_Technique.json',
                'FC_Installation.json',
                'FC_Maintenance.json',
                'FC_Formation.json',
                'Fiches_Securite.json',
                'Fiches_Se_curite_.json'
            ];

            for (const filename of possibleFiles) {
                try {
                    const response = await fetch(filename);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.flashcards && Array.isArray(data.flashcards)) {
                            availableFiles.push({
                                name: filename,
                                count: data.flashcards.length,
                                data: data
                            });
                        }
                    }
                } catch (e) {
                    // Fichier non trouvé, on continue
                }
            }

            return availableFiles;
        }

        // Afficher la modal avec la liste des fichiers
        async function showFileList() {
            const modal = document.getElementById('modalOverlay');
            const fileListContainer = document.getElementById('fileList');
            
            modal.classList.add('show');
            fileListContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: #999;">Recherche des fichiers...</div>';
            
            const files = await detectFiles();
            
            if (files.length === 0) {
                fileListContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">Aucun fichier FC*.json trouvé<br>dans le même répertoire</div>
                    </div>
                `;
            } else {
                fileListContainer.innerHTML = '';
                files.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.innerHTML = `
                        <span class="file-icon">📄</span>
                        <span class="file-name">${file.name}</span>
                        <span class="file-badge">${file.count} cartes</span>
                    `;
                    fileItem.onclick = () => {
                        loadFileData(file);
                        modal.classList.remove('show');
                    };
                    fileListContainer.appendChild(fileItem);
                });
            }
        }

        // Charger les données d'un fichier
        function loadFileData(fileObj) {
            cards = fileObj.data.flashcards;
            init();
        }

        // Fermer la modal
        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('modalOverlay').classList.remove('show');
        });

        // Fermer la modal en cliquant sur l'overlay
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') {
                document.getElementById('modalOverlay').classList.remove('show');
            }
        });

        // Bouton pour afficher la liste
        document.getElementById('fileListBtn').addEventListener('click', showFileList);

        // Chargement manuel de fichier
        document.getElementById('file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        cards = data.flashcards;
                        init();
                        document.getElementById('modalOverlay').classList.remove('show');
                    } catch {
                        alert('❌ Erreur de lecture du fichier');
                    }
                };
                reader.readAsText(file);
            }
        });

        function init() {
            idx = 0;
            viewed.clear();
            flips = 0;
            
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('cardWrap').classList.add('active');
            document.getElementById('shuffle').style.display = 'block';
            document.getElementById('restart').style.display = 'block';
            document.getElementById('navBar').classList.add('active');
            
            show();
        }

        function show() {
            if (!cards.length) return;

            const c = cards[idx];
            const card = document.getElementById('card');
            card.classList.remove('flip');
            
            document.getElementById('contentF').textContent = c.f;
            document.getElementById('contentB').textContent = c.b;
            
            const pos = idx + 1;
            document.getElementById('posF').textContent = pos;
            document.getElementById('posB').textContent = pos;
            
            viewed.add(idx);
            updateStats();
            updateProgress();
            updateDots();
            
            document.getElementById('prev').disabled = idx === 0;
            document.getElementById('next').disabled = idx === cards.length - 1;
        }

        function updateStats() {
            ['F', 'B'].forEach(s => {
                document.getElementById('total' + s).textContent = cards.length;
                document.getElementById('viewed' + s).textContent = viewed.size;
                document.getElementById('flip' + s).textContent = flips;
            });
        }

        function updateProgress() {
            const txt = `${idx + 1}/${cards.length}`;
            document.getElementById('progTextF').textContent = txt;
            document.getElementById('progTextB').textContent = txt;
        }

        function updateDots() {
            const maxDots = Math.min(10, cards.length);
            ['F', 'B'].forEach(s => {
                const container = document.getElementById('dots' + s);
                container.innerHTML = '';
                
                for (let i = 0; i < maxDots; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    const dotIdx = Math.floor((i / maxDots) * cards.length);
                    if (dotIdx <= idx) dot.classList.add('active');
                    container.appendChild(dot);
                }
            });
        }

        document.getElementById('card').addEventListener('click', () => {
            document.getElementById('card').classList.toggle('flip');
            flips++;
            updateStats();
        });

        document.getElementById('prev').addEventListener('click', () => {
            if (idx > 0) {
                idx--;
                show();
            }
        });

        document.getElementById('next').addEventListener('click', () => {
            if (idx < cards.length - 1) {
                idx++;
                show();
            }
        });

        document.getElementById('shuffle').addEventListener('click', () => {
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            idx = 0;
            show();
        });

        document.getElementById('restart').addEventListener('click', () => {
            idx = 0;
            show();
        });

        document.addEventListener('keydown', (e) => {
            if (!cards.length) return;
            
            if (e.key === 'ArrowLeft' && idx > 0) {
                idx--;
                show();
            } else if (e.key === 'ArrowRight' && idx < cards.length - 1) {
                idx++;
                show();
            } else if (e.key === ' ') {
                e.preventDefault();
                document.getElementById('card').classList.toggle('flip');
                flips++;
                updateStats();
            } else if (e.key === 'Escape') {
                document.getElementById('modalOverlay').classList.remove('show');
            }
        });

        // Auto-détecter les fichiers au chargement de la page
        window.addEventListener('load', () => {
            detectFiles();
        });
    </script>
</body>
</html>
