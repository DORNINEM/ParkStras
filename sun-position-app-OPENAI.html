<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Simulateur course du soleil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 0.5rem 1rem;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 1rem;
            margin: 0;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.9rem;
        }

        .controls input[type="text"] {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            border: 1px solid #d1d5db;
            min-width: 220px;
        }

        .controls button {
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            background: #e5e7eb;
            font-size: 0.85rem;
        }

        .controls button.primary {
            background: #3b82f6;
            color: white;
        }

        .controls button.active {
            background: #1f2937;
            color: white;
        }

        #map {
            flex: 1;
            width: 100%;
        }

        .legend {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: white;
            padding: 0.5rem 0.75rem;
            font-size: 0.8rem;
            border-radius: 0.5rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            line-height: 1.4;
        }

        .legend div {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .legend span.color {
            display: inline-block;
            width: 14px;
            height: 3px;
            border-radius: 999px;
        }

        .legend .today {
            background: #ef4444;
        }

        .legend .summer {
            background: #22c55e;
        }

        .legend .winter {
            background: #3b82f6;
        }

        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #111827;
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            display: none;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <header>
        <h1>Course du soleil pour positionner un panneau solaire</h1>
        <div class="controls">
            <button id="geoBtn" class="primary">📍 Me géolocaliser</button>

            <input type="text" id="addressInput" placeholder="Saisir une adresse (ex : 10 rue ... ville)" />
            <button id="searchBtn">Rechercher</button>

            <span>Afficher la course du soleil :</span>
            <button class="modeBtn active" data-mode="today">Aujourd'hui</button>
            <button class="modeBtn" data-mode="summer">Été</button>
            <button class="modeBtn" data-mode="winter">Hiver</button>
        </div>
    </header>

    <div id="map"></div>
    <div class="legend">
        <strong>Codes couleur :</strong>
        <div><span class="color today"></span> Aujourd'hui</div>
        <div><span class="color summer"></span> Été (21 juin)</div>
        <div><span class="color winter"></span> Hiver (21 décembre)</div>
        <div style="margin-top: 0.3rem;">Cercles numérotés = heure (6–20h)</div>
    </div>
    <div class="toast" id="toast"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- SunCalc -->
    <script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>

    <script>
        // ----- Utils -----
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.style.display = "block";
            setTimeout(() => (toast.style.display = "none"), 2500);
        }

        function getDatesForMode(mode) {
            const now = new Date();
            const year = now.getFullYear();

            if (mode === "summer") {
                return new Date(year, 5, 21); // 21 juin
            }
            if (mode === "winter") {
                return new Date(year, 11, 21); // 21 décembre
            }
            // today
            return now;
        }

        function colorForMode(mode) {
            if (mode === "summer") return "#22c55e";
            if (mode === "winter") return "#3b82f6";
            return "#ef4444"; // today
        }

        // ----- Carte -----
        const map = L.map("map").setView([48.8566, 2.3522], 13); // Paris par défaut

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        let baseMarker = null;
        let sunLayers = {
            today: L.layerGroup().addTo(map),
            summer: L.layerGroup(),
            winter: L.layerGroup()
        };

        let currentLatLng = map.getCenter();
        let currentMode = "today";

        function setBasePosition(latlng, fly = true) {
            currentLatLng = latlng;
            if (baseMarker) {
                baseMarker.setLatLng(latlng);
            } else {
                baseMarker = L.marker(latlng, { draggable: true }).addTo(map);
                baseMarker.on("dragend", (e) => {
                    currentLatLng = e.target.getLatLng();
                    recomputeAllModes();
                });
            }
            if (fly) map.flyTo(latlng, 16, { duration: 0.8 });
            recomputeAllModes();
        }

        // ----- Calcul course du soleil -----
        function recomputeAllModes() {
            ["today", "summer", "winter"].forEach(mode => {
                computeSunPathForMode(mode);
            });
        }

        function computeSunPathForMode(mode) {
            const group = sunLayers[mode];
            group.clearLayers();

            if (!currentLatLng) return;

            const baseLat = currentLatLng.lat;
            const baseLng = currentLatLng.lng;
            const basePoint = [baseLat, baseLng];

            const dateBase = getDatesForMode(mode);

            for (let hour = 6; hour <= 20; hour++) {
                const date = new Date(dateBase);
                date.setHours(hour, 0, 0, 0);

                const pos = SunCalc.getPosition(date, baseLat, baseLng);
                const azimuth = pos.azimuth; // radians, depuis le sud, vers l'ouest
                const altitude = pos.altitude; // radians au-dessus de l'horizon

                // On ne trace que si le soleil est au-dessus de l’horizon
                if (altitude <= 0) continue;

                // Conversion : azimuth SunCalc (0 = sud, positif vers l’ouest)
                // On approxime une direction de rayon sur la carte.
                const lengthMeters = 80; // longueur du rayon sur la carte

                const azFromNorthClockwise = (Math.PI / 2) - azimuth; // approx
                const dx = lengthMeters * Math.cos(azFromNorthClockwise);
                const dy = lengthMeters * Math.sin(azFromNorthClockwise);

                // Utiliser la fonction leaflet pour projeter distance & direction
                const dest = L.latLng(
                    baseLat + (dy / 111320), // très approximatif mais suffisant pour de la visu
                    baseLng + (dx / (40075000 * Math.cos(baseLat * Math.PI / 180) / 360))
                );

                const lineColor = colorForMode(mode);

                L.polyline([basePoint, dest], {
                    color: lineColor,
                    weight: mode === currentMode ? 3 : 1,
                    opacity: mode === currentMode ? 0.9 : 0.4
                }).addTo(group);

                const hourLabel = L.circleMarker(dest, {
                    radius: 12,
                    color: lineColor,
                    weight: 2,
                    fillColor: "#ffffff",
                    fillOpacity: 0.9
                }).addTo(group);

                hourLabel.bindTooltip(
                    `${hour}h<br>Altitude: ${(altitude * 180 / Math.PI).toFixed(1)}°`,
                    { direction: "top" }
                );

                const textIcon = L.divIcon({
                    className: "hour-label",
                    html: `<div style="font-size:10px;font-weight:bold;">${hour}</div>`,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });

                L.marker(dest, { icon: textIcon, interactive: false }).addTo(group);
            }

            // S'assurer que la couche active est visible
            Object.keys(sunLayers).forEach(k => {
                if (k === currentMode) {
                    if (!map.hasLayer(sunLayers[k])) map.addLayer(sunLayers[k]);
                } else {
                    if (!map.hasLayer(sunLayers[k])) map.addLayer(sunLayers[k]);
                }
            });
        }

        // ----- Géolocalisation -----
        document.getElementById("geoBtn").addEventListener("click", () => {
            if (!navigator.geolocation) {
                showToast("La géolocalisation n'est pas supportée par ce navigateur.");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    setBasePosition(latlng, true);
                    showToast("Position détectée.");
                },
                (err) => {
                    console.error(err);
                    showToast("Impossible de récupérer la position.");
                }
            );
        });

        // ----- Recherche d'adresse (Nominatim) -----
        async function geocodeAddress(address) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`;
            const res = await fetch(url, {
                headers: {
                    "Accept-Language": "fr"
                }
            });
            if (!res.ok) throw new Error("Erreur réseau");
            const data = await res.json();
            if (!data || data.length === 0) throw new Error("Adresse introuvable");
            return {
                lat: parseFloat(data[0].lat),
                lng: parseFloat(data[0].lon)
            };
        }

        document.getElementById("searchBtn").addEventListener("click", async () => {
            const input = document.getElementById("addressInput");
            const address = input.value.trim();
            if (!address) {
                showToast("Veuillez saisir une adresse.");
                return;
            }
            showToast("Recherche en cours...");
            try {
                const latlng = await geocodeAddress(address);
                setBasePosition(latlng, true);
                showToast("Adresse trouvée.");
            } catch (e) {
                console.error(e);
                showToast("Adresse introuvable.");
            }
        });

        document.getElementById("addressInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                document.getElementById("searchBtn").click();
            }
        });

        // ----- Changement de mode -----
        document.querySelectorAll(".modeBtn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".modeBtn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentMode = btn.dataset.mode;
                recomputeAllModes();
            });
        });

        // Initialisation : position par défaut + calcul
        setBasePosition(currentLatLng, false);
    </script>
</body>

</html>
