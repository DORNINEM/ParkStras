<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERMES Archives</title>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --accent: #2563eb;
  --accent-weak: #eff6ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
}
.container { max-width: 980px; margin: 0 auto; padding: 24px; }
header { text-align: center; margin-bottom: 20px; }
header img { max-height: 120px; }
h1 { font-size: 1.5rem; margin: 12px 0 4px; }
.subtitle { color: var(--muted); font-size: 0.95rem; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tab {
  padding: 8px 12px; border-radius: 8px 8px 0 0; cursor: pointer;
  border: 1px solid var(--border); border-bottom: none;
  background: var(--surface); color: var(--muted); font-weight: 500;
}
.tab.active { background: var(--surface); color: var(--text); border-top: 2px solid var(--accent); }
.tab:disabled { opacity: 0.6; cursor: not-allowed; }
.panel { display: none; border: 1px solid var(--border); border-radius: 0 8px 8px 8px; background: var(--surface); padding: 16px; }
.panel.active { display: block; }
.panel h2 { font-size: 1.1rem; margin: 0 0 10px; }
.list { list-style: none; padding: 0; margin: 0; }
.list li { padding: 6px 0; border-bottom: 1px solid var(--border); }
.list li:last-child { border-bottom: none; }
.list a { color: var(--accent); text-decoration: none; }
.list a:hover { text-decoration: underline; }
.empty { color: var(--muted); font-style: italic; }
footer { margin-top: 24px; text-align: center; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="container">
<header>
<img src="innovia2.png" alt="Innovia">
<h1>HERMES Archives</h1>
<p class="subtitle">Accès aux publications archivées par thématique</p>
</header>
<nav class="tabs" id="tabs"></nav>
<div id="panels"></div>
<footer>Dernière mise à jour automatique</footer>
</div>
<script>
document.addEventListener("DOMContentLoaded", function(){
  const tabs = document.querySelectorAll(".tab");
  const panels = document.querySelectorAll(".panel");
  tabs.forEach(btn => {
    btn.addEventListener("click", () => {
      const target = btn.getAttribute("data-target");
      tabs.forEach(b => b.classList.remove("active"));
      panels.forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(target).classList.add("active");
    });
  });
});
</script>
</body></html>
