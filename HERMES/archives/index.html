<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HERMES Archives</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #151922;
      --border: #232a36;
      --muted: #8a93a6;
      --text: #e6e8ee;
      --accent: #7aa7ff;
      --accent-2: #5cc9a7;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: linear-gradient(180deg, #0f1218 0%, var(--bg) 100%);
      color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      min-height: 100vh;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 24px 64px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
    }
    .brand img {
      height: 64px;
      width: auto;
      display: block;
      border-radius: 12px;
      background: #0b0e14;
      border: 1px solid var(--border);
      padding: 8px;
      box-shadow: var(--shadow);
    }
    .brand h1 {
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.2px;
      font-size: 26px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .tab {
      appearance: none;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .tab:hover { color: #fff; background: #161c26; }
    .tab[aria-selected="true"] {
      color: #fff;
      background: linear-gradient(180deg, #1b2333, #16202b);
      border-color: #2a3344;
    }
    .tab:disabled {
      opacity: .6;
      cursor: not-allowed;
      color: var(--muted);
    }
    .panels { }
    .panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .panel[aria-hidden="false"] { display: block; }
    .panel-title {
      margin: 0 0 14px;
      font-size: 18px;
      color: #d6dae3;
    }
    .empty {
      color: var(--muted);
      font-style: italic;
    }
    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }
    .list a {
      display: block;
      color: var(--text);
      text-decoration: none;
      background: #111722;
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 10px;
      transition: transform .05s ease, border-color .15s ease, background .15s ease;
    }
    .list a:hover {
      border-color: #2f3a4f;
      background: #131c2a;
      transform: translateY(-1px);
    }
    .list a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .list .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .list .meta {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

    <div class="brand">
      <img src="innovia2.png" alt="Innovia" />
      <h1>HERMES Archives</h1>
    </div>

    <div class="tabs" role="tablist" aria-label="Catégories">
      <button class="tab" role="tab" aria-selected="false" aria-controls="panel-mistral" id="tab-mistral">Actualités Mistral</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="panel-ia" id="tab-ia">Actualités IA global</button>

      <button class="tab" role="tab" aria-selected="false" aria-controls="panel-diabete" id="tab-diabete">Veille Diabète</button>
    </div>

    <div class="panels">

      <section class="panel" role="tabpanel" id="panel-tele" aria-labelledby="tab-tele" aria-hidden="true">

        <div class="list" id="list-tele"></div>
      </section>

      <section class="panel" role="tabpanel" id="panel-rhia" aria-labelledby="tab-rhia" aria-hidden="true">

        <div class="list" id="list-rhia"></div>
      </section>

      <section class="panel" role="tabpanel" id="panel-quantique" aria-labelledby="tab-quantique" aria-hidden="true">
        <h2 class="panel-title">Veille IA Q</h2>
        <div class="list" id="list-quantique"></div>
      </section>

      <section class="panel" role="tabpanel" id="panel-diabete" aria-labelledby="tab-diabete" aria-hidden="true">

    </div>

    <p class="footer">Navigation par ordre antéchronologique.</p>
  </div>

      const { tab, panel, list } = mapping[key];
      const container = document.getElementById(list);
      const tabEl = document.getElementById(tab);
      const panelEl = document.getElementById(panel);

      if (!files.length) {
        tabEl.disabled = true;
        container.innerHTML = '<p class="empty">Aucune publication disponible.</p>';
        return;
      }

      tabEl.disabled = false;
      container.innerHTML = files.map(f => {
        const name = f.replace(/\.html$/, '').replace(/\.md$/, '');
        return `<a href="${f}" title="${name}">
          <span class="tag">${name}</span>
          <span class="meta">${f}</span>
        </a>`;
      }).join('');
    });

    function activate(key) {
      document.querySelectorAll('[role="tab"]').forEach(t => t.setAttribute('aria-selected', 'false'));
      document.querySelectorAll('[role="tabpanel"]').forEach(p => p.setAttribute('aria-hidden', 'true'));

      const { tab, panel } = mapping[key];
      document.getElementById(tab).setAttribute('aria-selected', 'true');
      document.getElementById(panel).setAttribute('aria-hidden', 'false');
    }

    document.querySelectorAll('[role="tab"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.id.replace('tab-', '');
        activate(key);
      });
    });
