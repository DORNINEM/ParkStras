<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gesture Particles</title>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        
        #input_video { display: none; }
        
        /* UI Panel */
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        h2 { margin: 0 0 10px 0; font-size: 20px; font-weight: 700; color: #fff; }
        
        .instructions { 
            background: rgba(255,255,255,0.05); 
            padding: 10px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
        }
        
        .instruction-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #ccc;
            margin-bottom: 6px;
        }
        
        .icon { margin-right: 8px; font-size: 14px; width: 20px; text-align: center;}

        .control-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: #888; font-weight: bold;}

        /* Shape Buttons */
        .shape-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #eee;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            font-weight: 500;
        }
        button:hover { background: rgba(255,255,255,0.25); }
        button.active { background: #00d2ff; color: #000; box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }

        /* Color Picker */
        .color-wrapper {
            position: relative;
            height: 40px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }
        input[type="color"] {
            width: 110%; height: 110%;
            position: absolute; top: -5%; left: -5%;
            border: none; cursor: pointer; background: none;
        }

        /* Status & Loading */
        #status {
            position: absolute; bottom: 30px; left: 30px;
            color: rgba(255,255,255,0.6); font-size: 16px; font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none;
        }
        
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #050505;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; z-index: 200; transition: opacity 0.5s;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid #333; border-top: 4px solid #00d2ff;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <video id="input_video"></video>

    <div id="loading">
        <div class="spinner"></div>
        <div style="font-size: 14px; letter-spacing: 2px;">INITIALIZING VISION CORE</div>
    </div>

    <div id="status">Waiting for hands...</div>

    <div id="ui-panel">
        <h2>Particle Core</h2>
        
        <div class="instructions">
            <div class="instruction-item"><span class="icon">↔</span> Spread hands to Expand</div>
            <div class="instruction-item"><span class="icon">↕</span> Move Up/Down to Tilt</div>
            <div class="instruction-item"><span class="icon">↔</span> Move Left/Right to Rotate</div>
        </div>
        
        <div class="control-group">
            <label>Geometry Template</label>
            <div class="shape-grid">
                <button onclick="setShape('saturn')" class="active" id="btn-saturn">Saturn</button>
                <button onclick="setShape('sphere')" id="btn-sphere">Sphere</button>
                <button onclick="setShape('heart')" id="btn-heart">Heart</button>
                <button onclick="setShape('flower')" id="btn-flower">Flower</button>
                <button onclick="setShape('buddha')" id="btn-buddha">Figure</button>
                <button onclick="setShape('dna')" id="btn-dna">Helix</button>
            </div>
        </div>

        <div class="control-group">
            <label>Particle Color</label>
            <div class="color-wrapper">
                <input type="color" id="colorPicker" value="#00d2ff">
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const PARTICLE_COUNT = 18000;
        const PARTICLE_SIZE = 0.06;
        
        // --- THREE.JS ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- PARTICLES ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        
        // Initial Scatter
        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 15;
            targetPositions[i] = positions[i];
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/spark1.png');
        
        const material = new THREE.PointsMaterial({
            color: 0x00d2ff,
            size: PARTICLE_SIZE,
            map: sprite,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- MATH / SHAPES ---
        let currentShape = 'saturn'; // Default to Saturn to show off rotation

        // Interaction State
        let targetScale = 1.0;
        let smoothScale = 1.0;
        
        let targetRotX = 0.4; // Initial tilt
        let targetRotY = 0;
        let smoothRotX = 0.4;
        let smoothRotY = 0;
        
        let handsDetected = false;

        function getPointOnSphere() {
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            const r = 2.5;
            return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi) };
        }

        function getPointOnHeart() {
            const t = Math.random() * Math.PI * 2;
            const u = Math.random() * Math.PI;
            const x = 16 * Math.pow(Math.sin(t), 3) * Math.sin(u);
            const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * Math.sin(u);
            const z = 6 * Math.cos(u);
            return { x: x * 0.18, y: y * 0.18, z: z * 0.18 };
        }

        function getPointOnSaturn() {
            // Planet Body
            if (Math.random() > 0.4) {
                const u = Math.random();
                const v = Math.random();
                const theta = 2 * Math.PI * u;
                const phi = Math.acos(2 * v - 1);
                const r = 1.5; 
                return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi) };
            } else {
                // Rings
                const angle = Math.random() * Math.PI * 2;
                const dist = 2.2 + Math.random() * 2.5; // Wide rings
                // Flatten Y very significantly
                return {
                    x: Math.cos(angle) * dist,
                    y: (Math.random() - 0.5) * 0.05, 
                    z: Math.sin(angle) * dist
                };
            }
        }

        function getPointOnFlower() {
            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI;
            const r = 2 + Math.sin(7 * u) * Math.sin(7 * v); 
            return { x: r * Math.sin(v) * Math.cos(u) * 0.8, y: r * Math.sin(v) * Math.sin(u) * 0.8, z: r * Math.cos(v) * 0.8 };
        }

        function getPointHelix() {
            const t = Math.random() * 20 - 10;
            const strand = Math.random() > 0.5 ? 1 : -1;
            return {
                x: Math.cos(t) * 1.5 + strand,
                y: t * 0.5,
                z: Math.sin(t) * 1.5
            };
        }
        
        function getPointFigure() {
             // Abstract Lotus Position
            const r = Math.random();
            if (r < 0.2) { // Head
                 const s = getPointOnSphere();
                 return {x: s.x*0.5, y: s.y*0.5 + 2.0, z: s.z*0.5};
            } else if (r < 0.6) { // Torso
                 return {x: (Math.random()-0.5)*1.5, y: (Math.random()*2), z: (Math.random()-0.5)};
            } else { // Base
                 const angle = Math.random() * Math.PI * 2;
                 const rad = 1.0 + Math.random();
                 return {x: Math.cos(angle)*rad, y: -0.5 + (Math.random()*0.5), z: Math.sin(angle)*rad};
            }
        }

        function updateShape() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let p;
                switch(currentShape) {
                    case 'heart': p = getPointOnHeart(); break;
                    case 'flower': p = getPointOnFlower(); break;
                    case 'saturn': p = getPointOnSaturn(); break;
                    case 'dna': p = getPointHelix(); break;
                    case 'buddha': p = getPointFigure(); break;
                    case 'sphere': default: p = getPointOnSphere(); break;
                }
                targetPositions[i * 3] = p.x;
                targetPositions[i * 3 + 1] = p.y;
                targetPositions[i * 3 + 2] = p.z;
            }
        }

        // --- UI ---
        window.setShape = (shape) => {
            currentShape = shape;
            document.querySelectorAll('.shape-grid button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${shape}`).classList.add('active');
            updateShape();
        };

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            material.color.set(e.target.value);
        });

        // --- VISION AI ---
        const videoElement = document.getElementById('input_video');
        const statusElement = document.getElementById('status');
        const loadingElement = document.getElementById('loading');

        function onResults(results) {
            loadingElement.style.opacity = '0';
            setTimeout(() => loadingElement.style.display = 'none', 500);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
                handsDetected = true;
                statusElement.innerHTML = "Hands Detected <span style='color:#00d2ff'>●</span> Active";
                statusElement.style.color = "#fff";

                const h1 = results.multiHandLandmarks[0][9]; // Middle finger knuckle (more stable than tip)
                const h2 = results.multiHandLandmarks[1][9];

                // 1. CALCULATE DISTANCE (SCALE)
                const dx = h1.x - h2.x;
                const dy = h1.y - h2.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                targetScale = Math.max(0.2, Math.min(dist * 4.0, 5.0));

                // 2. CALCULATE CENTER POINT (ROTATION)
                // MediaPipe coords: X [0..1] (Left->Right), Y [0..1] (Top->Bottom)
                const avgX = (h1.x + h2.x) / 2;
                const avgY = (h1.y + h2.y) / 2;

                // Map Y (Vertical) to Rotation X (Tilt)
                // 0 (top) -> Tilt down (+1.5 rad)
                // 1 (bottom) -> Tilt up (-1.5 rad)
                targetRotX = (avgY - 0.5) * 3.0; 

                // Map X (Horizontal) to Rotation Y (Spin)
                // 0 (left) -> Rotate left
                // 1 (right) -> Rotate right
                targetRotY = (avgX - 0.5) * 4.0; 

            } else {
                handsDetected = false;
                statusElement.innerHTML = "Waiting for two hands...";
                statusElement.style.color = "rgba(255,255,255,0.5)";
                // Reset to idle state slowly
                targetScale = 1.0;
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        cameraUtils.start();

        // --- LOOP ---
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // 1. Smoothly interpolate control values
            const lerpFactor = 5.0 * delta;
            smoothScale += (targetScale - smoothScale) * lerpFactor;
            
            if(handsDetected) {
                // Manual Control
                smoothRotX += (targetRotX - smoothRotX) * lerpFactor;
                smoothRotY += (targetRotY - smoothRotY) * lerpFactor;
            } else {
                // Idle Animation (Auto Rotate)
                smoothRotY += 0.2 * delta; 
                smoothRotX += (0.4 - smoothRotX) * 0.05; // Return to nice tilt
            }

            // 2. Update Particles
            const pos = geometry.attributes.position.array;
            const speed = 3.5 * delta;

            for(let i=0; i < PARTICLE_COUNT; i++) {
                const px = i*3, py = i*3+1, pz = i*3+2;
                // Move towards target shape
                pos[px] += (targetPositions[px] - pos[px]) * speed;
                pos[py] += (targetPositions[py] - pos[py]) * speed;
                pos[pz] += (targetPositions[pz] - pos[pz]) * speed;
            }
            geometry.attributes.position.needsUpdate = true;

            // 3. Apply Transformations
            // Scale
            particles.scale.setScalar(smoothScale);
            
            // Rotation
            particles.rotation.x = smoothRotX;
            particles.rotation.y = smoothRotY;

            // Add slight gentle wave to particle system independently of hands for "life"
            particles.position.y = Math.sin(time * 0.5) * 0.2;

            renderer.render(scene, camera);
        }

        updateShape();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
